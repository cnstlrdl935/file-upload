<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>파일 업로드</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;

      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

      background: #f5f5f5;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 600px;

      margin: 40px auto;

      padding: 30px;

      background: white;

      border-radius: 16px;

      box-shadow:
        0 5px 25px
        rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 25px;

      font-size: 28px;
    }

    .file-box {
      padding: 25px;

      border: 2px dashed #bbb;

      border-radius: 12px;

      text-align: center;

      margin-bottom: 20px;
    }

    input[type="file"] {
      width: 100%;

      padding: 10px;

      font-size: 15px;
    }

    .file-name {
      margin-top: 15px;

      font-size: 14px;

      color: #555;

      word-break: break-all;
    }

    button {
      width: 100%;

      padding: 15px;

      border: 0;

      border-radius: 10px;

      background: #222;

      color: white;

      font-size: 17px;

      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .message {
      display: none;

      margin-bottom: 20px;

      padding: 15px;

      border-radius: 10px;

      line-height: 1.5;

      word-break: break-word;
    }

    .message.success {
      display: block;

      background: #e8f7e8;
      color: #176b17;
    }

    .message.error {
      display: block;

      background: #fdeaea;
      color: #a11;
    }

    .info {
      margin-top: 25px;

      padding: 15px;

      background: #f3f3f3;

      border-radius: 10px;

      font-size: 13px;

      line-height: 1.6;

      color: #555;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>파일 업로드</h1>


    <!-- 결과 메시지 -->

    <div
      id="message"
      class="message"
    ></div>


    <!--

      중요:
      fetch()를 사용하지 않습니다.

      브라우저가 Worker로 직접
      multipart/form-data POST를 전송합니다.

    -->

    <form
      id="uploadForm"
      action="https://files.hjcone.worker.dev/upload"
      method="POST"
      enctype="multipart/form-data"
    >

      <div class="file-box">

        <input
          type="file"
          id="file"
          name="file"
          required
        >

        <div
          id="fileName"
          class="file-name"
        >
          선택된 파일 없음
        </div>

      </div>


      <button
        id="uploadButton"
        type="submit"
      >
        파일 업로드
      </button>

    </form>


    <div class="info">

      업로드된 파일은 GitHub 저장소의
      <strong>uploads/</strong>
      폴더에 저장됩니다.

      <br><br>

      업로드 과정은
      <strong>GitHub Pages → Cloudflare Worker → GitHub</strong>
      순서로 진행됩니다.

    </div>

  </div>


<script>

const fileInput =
  document.getElementById("file");

const fileName =
  document.getElementById("fileName");

const form =
  document.getElementById("uploadForm");

const uploadButton =
  document.getElementById("uploadButton");

const message =
  document.getElementById("message");


/*
========================================
파일 선택 표시
========================================
*/

fileInput.addEventListener(
  "change",
  function () {

    if (fileInput.files.length === 0) {

      fileName.textContent =
        "선택된 파일 없음";

      return;
    }

    const file =
      fileInput.files[0];

    const size =
      formatFileSize(file.size);

    fileName.textContent =
      `${file.name} (${size})`;
  }
);


/*
========================================
업로드 시작
========================================
*/

form.addEventListener(
  "submit",
  function () {

    if (fileInput.files.length === 0) {
      return;
    }

    uploadButton.disabled = true;

    uploadButton.textContent =
      "업로드 중...";

  }
);


/*
========================================
URL 결과 메시지
========================================
*/

const params =
  new URLSearchParams(
    window.location.search
  );

const status =
  params.get("status");

const resultMessage =
  params.get("message");


if (status && resultMessage) {

  message.textContent =
    resultMessage;

  if (status === "success") {

    message.className =
      "message success";

  } else {

    message.className =
      "message error";

  }

}


/*
========================================
파일 크기 표시
========================================
*/

function formatFileSize(bytes) {

  if (bytes === 0) {
    return "0 B";
  }

  const units = [
    "B",
    "KB",
    "MB",
    "GB"
  ];

  const index =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );

  const size =
    bytes /
    Math.pow(1024, index);

  return (
    size.toFixed(2) +
    " " +
    units[index]
  );
}

</script>

</body>

</html>
