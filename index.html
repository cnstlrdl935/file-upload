<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>파일 관리</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
        }

        h1 {
            margin-bottom: 25px;
        }

        .upload-box {
            padding: 40px 25px;
            background: white;
            border: 2px dashed #cfd5df;
            border-radius: 16px;
            text-align: center;
            transition: 0.2s;
        }

        .upload-box.dragover {
            border-color: #24292f;
            background: #f0f2f5;
        }

        .upload-box p {
            margin-bottom: 20px;
        }

        input[type="file"] {
            display: none;
        }

        .select-button,
        .upload-button,
        .delete-button {
            display: inline-block;
            border: 0;
            border-radius: 8px;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 14px;
        }

        .select-button,
        .upload-button {
            background: #24292f;
            color: white;
        }

        .upload-button {
            width: 100%;
            margin-top: 15px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .file-list {
            margin-top: 25px;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            margin-bottom: 10px;
            background: white;
            border-radius: 10px;
        }

        .preview {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            background: #eee;
        }

        .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-weight: bold;
            word-break: break-all;
        }

        .file-size {
            margin-top: 5px;
            color: #777;
            font-size: 13px;
        }

        .progress {
            width: 100%;
            height: 7px;
            margin-top: 8px;
            background: #eee;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #24292f;
            transition: width 0.2s;
        }

        .status {
            margin-top: 8px;
            font-size: 13px;
        }

        .success {
            color: #16803c;
        }

        .error {
            color: #c62828;
        }

        .uploaded {
            margin-top: 40px;
        }

        .uploaded-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 15px;
            margin-bottom: 10px;
            background: white;
            border-radius: 10px;
        }

        .uploaded-item a {
            color: #0969da;
            text-decoration: none;
            word-break: break-all;
        }

        .delete-button {
            background: #c62828;
            color: white;
            flex-shrink: 0;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .file-item,
            .uploaded-item {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>파일 업로드</h1>

    <div
        id="dropArea"
        class="upload-box"
    >
        <p>
            파일을 이곳으로 끌어놓으세요.
        </p>

        <label class="select-button">
            파일 선택
            <input
                id="fileInput"
                type="file"
                multiple
            >
        </label>
    </div>

    <div id="fileList" class="file-list"></div>

    <button
        id="uploadButton"
        class="upload-button"
        disabled
    >
        선택한 파일 업로드
    </button>

    <div class="uploaded">
        <h2>업로드된 파일</h2>

        <div id="uploadedList">
            불러오는 중...
        </div>
    </div>

</div>


<script>

const API =
    "https://YOUR-WORKER.workers.dev";


const fileInput =
    document.getElementById("fileInput");

const dropArea =
    document.getElementById("dropArea");

const fileList =
    document.getElementById("fileList");

const uploadButton =
    document.getElementById("uploadButton");

const uploadedList =
    document.getElementById("uploadedList");


let selectedFiles = [];


/*
    파일 선택
*/

fileInput.addEventListener(
    "change",
    () => {

        addFiles(
            Array.from(fileInput.files)
        );

    }
);


/*
    드래그 앤 드롭
*/

dropArea.addEventListener(
    "dragover",
    event => {

        event.preventDefault();

        dropArea.classList.add(
            "dragover"
        );

    }
);


dropArea.addEventListener(
    "dragleave",
    () => {

        dropArea.classList.remove(
            "dragover"
        );

    }
);


dropArea.addEventListener(
    "drop",
    event => {

        event.preventDefault();

        dropArea.classList.remove(
            "dragover"
        );

        addFiles(
            Array.from(
                event.dataTransfer.files
            )
        );

    }
);


/*
    파일 추가
*/

function addFiles(files) {

    const MAX_SIZE =
        10 * 1024 * 1024;


    const allowedTypes = [
        "image/png",
        "image/jpeg",
        "image/gif",
        "image/webp",
        "application/pdf",
        "text/plain",
        "application/zip"
    ];


    for (const file of files) {

        if (
            file.size >
            MAX_SIZE
        ) {

            alert(
                `${file.name}\n10 MB를 초과했습니다.`
            );

            continue;
        }


        if (
            !allowedTypes.includes(
                file.type
            )
        ) {

            alert(
                `${file.name}\n허용되지 않는 파일 형식입니다.`
            );

            continue;
        }


        selectedFiles.push(file);

    }


    renderFiles();

}


/*
    선택된 파일 표시
*/

function renderFiles() {

    fileList.innerHTML = "";


    selectedFiles.forEach(
        (file, index) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "file-item";


            let preview = "";


            if (
                file.type.startsWith(
                    "image/"
                )
            ) {

                const url =
                    URL.createObjectURL(
                        file
                    );

                preview = `
                    <img
                        class="preview"
                        src="${url}"
                    >
                `;

            } else {

                preview = `
                    <div class="preview">
                        📄
                    </div>
                `;

            }


            item.innerHTML = `

                ${preview}

                <div class="file-info">

                    <div class="file-name">
                        ${escapeHtml(
                            file.name
                        )}
                    </div>

                    <div class="file-size">
                        ${formatSize(
                            file.size
                        )}
                    </div>

                    <div class="progress">
                        <div
                            class="progress-bar"
                            id="progress-${index}"
                        ></div>
                    </div>

                    <div
                        class="status"
                        id="status-${index}"
                    >
                    </div>

                </div>

            `;


            fileList.appendChild(
                item
            );

        }
    );


    uploadButton.disabled =
        selectedFiles.length === 0;

}


/*
    업로드
*/

uploadButton.addEventListener(
    "click",
    async () => {

        uploadButton.disabled = true;


        for (
            let i = 0;
            i < selectedFiles.length;
            i++
        ) {

            await uploadFile(
                selectedFiles[i],
                i
            );

        }


        selectedFiles = [];

        fileInput.value = "";

        uploadButton.disabled =
            true;


        loadUploadedFiles();

    }
);


/*
    파일 하나 업로드
*/

async function uploadFile(
    file,
    index
) {

    const status =
        document.getElementById(
            `status-${index}`
        );

    const progress =
        document.getElementById(
            `progress-${index}`
        );


    try {

        status.textContent =
            "파일을 읽는 중...";


        const base64 =
            await fileToBase64(
                file
            );


        status.textContent =
            "업로드 중...";


        const response =
            await fetch(
                `${API}/upload`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        fileName:
                            file.name,

                        content:
                            base64,

                        contentType:
                            file.type

                    })
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error ||
                "업로드 실패"
            );

        }


        progress.style.width =
            "100%";


        status.className =
            "status success";


        status.innerHTML =
            `
                업로드 완료
                <br>
                <a
                    href="${escapeHtml(
                        result.url
                    )}"
                    target="_blank"
                >
                    파일 보기
                </a>
            `;


    } catch (error) {

        console.error(error);


        status.className =
            "status error";


        status.textContent =
            "업로드 실패: " +
            error.message;

    }

}


/*
    업로드 목록
*/

async function loadUploadedFiles() {

    uploadedList.textContent =
        "불러오는 중...";


    try {

        const response =
            await fetch(
                `${API}/files`
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error ||
                "목록을 불러올 수 없습니다."
            );

        }


        uploadedList.innerHTML =
            "";


        if (
            result.files.length === 0
        ) {

            uploadedList.textContent =
                "업로드된 파일이 없습니다.";

            return;

        }


        result.files.forEach(
            file => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "uploaded-item";


                item.innerHTML = `

                    <div>

                        <a
                            href="${escapeHtml(
                                file.url
                            )}"
                            target="_blank"
                        >
                            ${escapeHtml(
                                file.name
                            )}
                        </a>

                        <div class="file-size">
                            ${formatSize(
                                file.size
                            )}
                        </div>

                    </div>

                    <button
                        class="delete-button"
                        onclick="deleteFile(
                            '${escapeJs(
                                file.name
                            )}',
                            '${escapeJs(
                                file.sha
                            )}'
                        )"
                    >
                        삭제
                    </button>

                `;


                uploadedList.appendChild(
                    item
                );

            }
        );


    } catch (error) {

        console.error(error);


        uploadedList.innerHTML = `
            <div class="error">
                파일 목록을 불러오지 못했습니다.
                <br>
                ${escapeHtml(
                    error.message
                )}
            </div>
        `;

    }

}


/*
    파일 삭제
*/

async function deleteFile(
    fileName,
    sha
) {

    if (
        !confirm(
            `${fileName}\n정말 삭제하시겠습니까?`
        )
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                `${API}/delete`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        fileName:
                            fileName,

                        sha:
                            sha

                    })
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error ||
                "삭제 실패"
            );

        }


        alert(
            "삭제되었습니다."
        );


        loadUploadedFiles();


    } catch (error) {

        alert(
            "삭제 실패: " +
            error.message
        );

    }

}


/*
    Base64 변환
*/

function fileToBase64(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();


            reader.onload = () => {

                const result =
                    reader.result;

                resolve(
                    result.split(",")[1]
                );

            };


            reader.onerror =
                () => reject(
                    new Error(
                        "파일을 읽을 수 없습니다."
                    )
                );


            reader.readAsDataURL(
                file
            );

        }
    );

}


/*
    파일 크기
*/

function formatSize(bytes) {

    if (bytes === 0) {
        return "0 B";
    }


    const units = [
        "B",
        "KB",
        "MB",
        "GB"
    ];


    const i =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    return (
        bytes /
        Math.pow(1024, i)
    ).toFixed(2) +
    " " +
    units[i];

}


/*
    HTML escape
*/

function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/*
    JavaScript 문자열 escape
*/

function escapeJs(value) {

    return String(value)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}


/*
    처음 실행
*/

loadUploadedFiles();

</script>

</body>
</html>
