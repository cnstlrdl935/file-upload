<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파일 업로드</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .upload-container {
            width: 90%;
            max-width: 500px;
            padding: 35px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
        }

        .file-area {
            margin-top: 25px;
            padding: 35px 20px;
            border: 2px dashed #cfd5df;
            border-radius: 12px;
            text-align: center;
        }

        input[type="file"] {
            width: 100%;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #24292f;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            text-align: center;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="upload-container">

    <h1>파일 업로드</h1>

    <div class="file-area">
        <input type="file" id="fileInput">
    </div>

    <button id="uploadButton">
        업로드
    </button>

    <div id="status"></div>

</div>

<script>

    // Cloudflare Worker 주소로 변경
    const UPLOAD_API =
        "https://YOUR-WORKER.workers.dev";


    const fileInput =
        document.getElementById("fileInput");

    const uploadButton =
        document.getElementById("uploadButton");

    const status =
        document.getElementById("status");


    uploadButton.addEventListener("click", async () => {

        const file = fileInput.files[0];

        if (!file) {
            status.textContent = "파일을 선택해주세요.";
            return;
        }


        // 최대 10 MB
        const MAX_SIZE = 10 * 1024 * 1024;

        if (file.size > MAX_SIZE) {
            status.textContent =
                "파일 크기는 10 MB 이하만 가능합니다.";
            return;
        }


        uploadButton.disabled = true;
        status.textContent = "업로드 중입니다...";


        try {

            const base64 =
                await fileToBase64(file);


            const response = await fetch(
                UPLOAD_API + "/upload",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        fileName: file.name,
                        content: base64,
                        contentType:
                            file.type ||
                            "application/octet-stream"
                    })
                }
            );


            const result =
                await response.json();


            if (!response.ok) {
                throw new Error(
                    result.error ||
                    "업로드에 실패했습니다."
                );
            }


            status.innerHTML = `
                업로드가 완료되었습니다.<br>
                <a
                    href="${escapeHtml(result.url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    업로드된 파일 보기
                </a>
            `;


            fileInput.value = "";


        } catch (error) {

            console.error(error);

            status.textContent =
                "업로드 실패: " +
                error.message;

        } finally {

            uploadButton.disabled = false;

        }

    });


    function fileToBase64(file) {

        return new Promise((resolve, reject) => {

            const reader =
                new FileReader();


            reader.onload = () => {

                const result =
                    reader.result;

                const base64 =
                    result.split(",")[1];

                resolve(base64);

            };


            reader.onerror = () => {

                reject(
                    new Error(
                        "파일을 읽을 수 없습니다."
                    )
                );

            };


            reader.readAsDataURL(file);

        });

    }


    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }

</script>

</body>
</html>
