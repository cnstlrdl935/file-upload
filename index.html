<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>서버 연결 테스트</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px;

      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

      background: #f5f5f5;
      color: #222;
    }

    .container {
      width: min(700px, 100%);
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 16px;

      padding: 30px;

      box-shadow:
        0 5px 25px
        rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
    }

    .status {
      margin-top: 20px;

      padding: 18px;

      border-radius: 10px;

      background: #eee;

      white-space: pre-wrap;
      word-break: break-word;
    }

    .success {
      background: #e8f7ed;
      color: #16803c;
    }

    .error {
      background: #ffebeb;
      color: #d32f2f;
    }

    .info {
      margin-top: 15px;

      padding: 15px;

      background: #f5f5f5;

      border-radius: 10px;

      white-space: pre-wrap;
      word-break: break-word;

      font-size: 14px;
    }

    button {
      width: 100%;

      padding: 14px;

      margin-top: 15px;

      border: 0;
      border-radius: 10px;

      background: #222;
      color: white;

      font-size: 16px;

      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="card">

      <h1>서버 연결 테스트</h1>

      <p>
        Cloudflare Worker와 GitHub Pages의
        연결 상태를 확인합니다.
      </p>


      <div
        id="status"
        class="status"
      >
        테스트 준비 중...
      </div>


      <div
        id="info"
        class="info"
      >
        진단 정보를 준비하고 있습니다.
      </div>


      <button
        id="testButton"
      >
        다시 테스트
      </button>

    </div>

  </div>


  <script>

    const API =
      "https://files.hjcone.worker.dev";


    const status =
      document.getElementById("status");


    const info =
      document.getElementById("info");


    const testButton =
      document.getElementById("testButton");


    /*
     * 테스트 1
     *
     * fetch()로 Worker의 /ping 요청
     */
    async function testFetch() {

      status.className = "status";

      status.textContent =
        "1단계: fetch 연결 테스트 중...";


      info.textContent =
        "요청 주소:\n" +
        API + "/ping";


      try {

        const response =
          await fetch(
            API + "/ping",
            {
              method: "GET",
              cache: "no-store"
            }
          );


        const text =
          await response.text();


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status +
            "\n\n" +
            text
          );

        }


        status.className =
          "status success";


        status.textContent =
          "1단계 성공\n\n" +
          "fetch()로 Worker에 연결되었습니다.";


        info.textContent =
          "서버 응답:\n" +
          text +
          "\n\n" +
          "현재 페이지:\n" +
          window.location.href +
          "\n\n" +
          "현재 Origin:\n" +
          window.location.origin;


        return true;


      } catch (error) {

        status.className =
          "status error";


        status.textContent =
          "1단계 실패\n\n" +
          "Failed to fetch";


        info.textContent =
          "오류 이름:\n" +
          (error.name || "없음") +

          "\n\n" +

          "오류 메시지:\n" +
          (error.message || "없음") +

          "\n\n" +

          "요청 주소:\n" +
          API + "/ping" +

          "\n\n" +

          "현재 페이지:\n" +
          window.location.href +

          "\n\n" +

          "현재 Origin:\n" +
          window.location.origin;


        return false;

      }

    }


    /*
     * 테스트 2
     *
     * fetch가 실패해도 브라우저 자체가
     * Worker 주소에 접근 가능한지 확인
     */
    function testImageRequest() {

      const image =
        new Image();


      image.onload = function () {

        info.textContent +=
          "\n\n" +
          "2단계: 브라우저 요청 성공";


      };


      image.onerror = function () {

        info.textContent +=
          "\n\n" +
          "2단계: 브라우저 요청 실패";

      };


      image.src =
        API +
        "/ping?test=" +
        Date.now();

    }


    /*
     * 전체 테스트
     */
    async function runTest() {

      await testFetch();

      testImageRequest();

    }


    testButton.addEventListener(
      "click",
      runTest
    );


    runTest();

  </script>

</body>

</html>
