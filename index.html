<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>파일 업로드</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    "Noto Sans KR",
    sans-serif;
  background: #f5f7fb;
  color: #202124;
}

.container {
  width: min(720px, calc(100% - 32px));
  margin: 60px auto;
}

.header {
  text-align: center;
  margin-bottom: 28px;
}

.header h1 {
  margin: 0;
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -1px;
}

.subtitle {
  margin: 10px 0 0;
  color: #6b7280;
  font-size: 15px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 28px;
  box-shadow:
    0 10px 30px rgba(0, 0, 0, 0.06);
  margin-bottom: 20px;
}

.drop-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 230px;
  padding: 30px;
  border: 2px dashed #d7dce5;
  border-radius: 16px;
  background: #fafbfc;
  cursor: pointer;
  transition:
    border-color 0.2s,
    background 0.2s,
    transform 0.2s;
  text-align: center;
}

.drop-area:hover {
  border-color: #7c3aed;
  background: #faf7ff;
}

.drop-area.dragover {
  border-color: #7c3aed;
  background: #f3edff;
  transform: scale(1.01);
}

.drop-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 8px;
}

.drop-description {
  color: #777f8c;
  font-size: 14px;
}

#fileInput {
  display: none;
}

.selected-file {
  display: none;
  margin-top: 16px;
  padding: 14px 16px;
  background: #f5f3ff;
  border-radius: 12px;
  color: #4c1d95;
  font-size: 14px;
  word-break: break-all;
}

.selected-file.show {
  display: block;
}

.button {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 15px;
  margin-top: 16px;
  background: #7c3aed;
  color: white;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition:
    background 0.2s,
    transform 0.1s;
}

.button:hover {
  background: #6d28d9;
}

.button:active {
  transform: scale(0.99);
}

.button:disabled {
  background: #c4b5fd;
  cursor: not-allowed;
}

#progressBox {
  display: none;
  margin-top: 22px;
}

.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 9px;
  font-size: 14px;
  font-weight: 600;
}

progress {
  width: 100%;
  height: 10px;
  appearance: none;
  border: none;
  border-radius: 999px;
  overflow: hidden;
}

progress::-webkit-progress-bar {
  background: #e5e7eb;
  border-radius: 999px;
}

progress::-webkit-progress-value {
  background: #7c3aed;
  border-radius: 999px;
}

progress::-moz-progress-bar {
  background: #7c3aed;
  border-radius: 999px;
}

.speed {
  margin-top: 8px;
  text-align: right;
  color: #7b8190;
  font-size: 12px;
}

.message {
  margin-top: 14px;
  font-size: 14px;
  line-height: 1.5;
}

.admin-section {
  text-align: center;
  margin-top: 8px;
}

.admin-button {
  border: none;
  background: transparent;
  color: #6b7280;
  font-size: 13px;
  cursor: pointer;
  padding: 8px 12px;
}

.admin-button:hover {
  color: #7c3aed;
}

#adminPanel {
  display: none;
}

.admin-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 22px;
}

.admin-title {
  font-size: 20px;
  font-weight: 800;
}

.admin-badge {
  display: inline-block;
  margin-top: 6px;
  padding: 4px 9px;
  border-radius: 999px;
  background: #ecfdf5;
  color: #047857;
  font-size: 12px;
  font-weight: 700;
}

.logout-button {
  border: 1px solid #e5e7eb;
  background: white;
  color: #6b7280;
  padding: 9px 13px;
  border-radius: 9px;
  cursor: pointer;
  white-space: nowrap;
}

.logout-button:hover {
  background: #f9fafb;
}

.admin-file-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.admin-file {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 14px 16px;
  border: 1px solid #edf0f4;
  border-radius: 12px;
  background: #fafbfc;
}

.admin-file-info {
  min-width: 0;
}

.admin-file-name {
  font-size: 14px;
  font-weight: 600;
  word-break: break-all;
}

.admin-file-size {
  margin-top: 4px;
  color: #8a919e;
  font-size: 12px;
}

.admin-file-actions {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.download-button,
.delete-button {
  border: none;
  border-radius: 8px;
  padding: 8px 11px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.download-button {
  background: #ede9fe;
  color: #6d28d9;
}

.download-button:hover {
  background: #ddd6fe;
}

.delete-button {
  background: #fef2f2;
  color: #dc2626;
}

.delete-button:hover {
  background: #fee2e2;
}

.empty-files {
  padding: 28px 10px;
  text-align: center;
  color: #8a919e;
  font-size: 14px;
}

.success {
  color: #059669;
}

.error {
  color: #dc2626;
}

@media (max-width: 600px) {
  .container {
    width: min(100% - 20px, 720px);
    margin: 30px auto;
  }

  .header h1 {
    font-size: 27px;
  }

  .card {
    padding: 20px;
    border-radius: 16px;
  }

  .drop-area {
    min-height: 200px;
  }

  .admin-file {
    align-items: flex-start;
    flex-direction: column;
  }

  .admin-file-actions {
    width: 100%;
  }

  .download-button,
  .delete-button {
    flex: 1;
  }

  .admin-header {
    align-items: flex-start;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>파일 업로드</h1>
    <p class="subtitle">
      파일을 선택하거나 끌어다 놓아 업로드하세요.
    </p>
  </div>

  <!-- 업로드 카드 -->
  <div class="card">

    <label id="dropArea" class="drop-area" for="fileInput">
      <div class="drop-title">
        파일을 선택하세요
      </div>

      <div class="drop-description">
        클릭하거나 파일을 이곳으로 끌어다 놓으세요.
      </div>
    </label>

    <input
      type="file"
      id="fileInput"
    >

    <div
      id="selectedFile"
      class="selected-file"
    ></div>

    <button
      id="uploadButton"
      class="button"
    >
      업로드
    </button>

    <!-- 업로드 진행률 -->
    <div id="progressBox">

      <div class="progress-header">
        <span>업로드 중</span>
        <span id="progressText">0%</span>
      </div>

      <progress
        id="progress"
        value="0"
        max="100"
      ></progress>

      <div
        id="speedText"
        class="speed"
      >
        -
      </div>

    </div>

    <div
      id="uploadMessage"
      class="message"
    ></div>

  </div>


  <!-- 관리자 버튼 -->
  <div class="admin-section">
    <button
      id="adminButton"
      class="admin-button"
    >
      관리자 모드
    </button>
  </div>

  <div
    id="adminMessage"
    class="message"
  ></div>


  <!-- 관리자 패널 -->
  <div
    id="adminPanel"
    class="card"
  >

    <div class="admin-header">

      <div>
        <div class="admin-title">
          관리자 파일 관리
        </div>

        <div class="admin-badge">
          관리자 인증됨
        </div>
      </div>

      <button
        id="logoutButton"
        class="logout-button"
      >
        로그아웃
      </button>

    </div>

    <div id="adminFiles">
      불러오는 중...
    </div>

  </div>

</div>


<script>

const API = "https://files.hjcone.workers.dev";

let selectedFileObject = null;
let adminPassword = sessionStorage.getItem("adminPassword") || "";


/* =========================
   요소
========================= */

const fileInput =
  document.getElementById("fileInput");

const dropArea =
  document.getElementById("dropArea");

const selectedFile =
  document.getElementById("selectedFile");

const uploadButton =
  document.getElementById("uploadButton");

const progressBox =
  document.getElementById("progressBox");

const progress =
  document.getElementById("progress");

const progressText =
  document.getElementById("progressText");

const speedText =
  document.getElementById("speedText");

const uploadMessage =
  document.getElementById("uploadMessage");

const adminButton =
  document.getElementById("adminButton");

const adminMessage =
  document.getElementById("adminMessage");

const adminPanel =
  document.getElementById("adminPanel");

const adminFiles =
  document.getElementById("adminFiles");

const logoutButton =
  document.getElementById("logoutButton");


/* =========================
   메시지
========================= */

function showMessage(element, message, type = "") {

  element.textContent = message;

  element.className = "message";

  if (type) {
    element.classList.add(type);
  }
}


function hideMessage(element) {

  element.textContent = "";
  element.className = "message";

}


/* =========================
   파일 크기
========================= */

function formatSize(bytes) {

  if (!bytes) {
    return "0 B";
  }

  const units = [
    "B",
    "KB",
    "MB",
    "GB",
    "TB"
  ];

  const index =
    Math.floor(
      Math.log(bytes) / Math.log(1024)
    );

  const size =
    bytes / Math.pow(1024, index);

  return `${size.toFixed(index === 0 ? 0 : 2)} ${units[index]}`;
}


/* =========================
   파일 선택
========================= */

function handleFile(file) {

  if (!file) {
    selectedFileObject = null;

    selectedFile.classList.remove("show");
    selectedFile.textContent = "";

    return;
  }

  selectedFileObject = file;

  selectedFile.textContent =
    `선택된 파일 · ${file.name} · ${formatSize(file.size)}`;

  selectedFile.classList.add("show");

  hideMessage(uploadMessage);
}


/* =========================
   파일 input
========================= */

fileInput.addEventListener(
  "change",
  () => {

    const file =
      fileInput.files[0];

    handleFile(file);

  }
);


/* =========================
   드래그 앤 드롭
========================= */

dropArea.addEventListener(
  "dragenter",
  (event) => {

    event.preventDefault();

    dropArea.classList.add("dragover");

  }
);

dropArea.addEventListener(
  "dragover",
  (event) => {

    event.preventDefault();

    dropArea.classList.add("dragover");

  }
);

dropArea.addEventListener(
  "dragleave",
  (event) => {

    event.preventDefault();

    dropArea.classList.remove("dragover");

  }
);

dropArea.addEventListener(
  "drop",
  (event) => {

    event.preventDefault();

    dropArea.classList.remove("dragover");

    const file =
      event.dataTransfer.files[0];

    if (!file) {
      return;
    }

    try {

      const dataTransfer =
        new DataTransfer();

      dataTransfer.items.add(file);

      fileInput.files =
        dataTransfer.files;

    } catch (error) {
      // 일부 브라우저에서는 input.files 설정이 제한될 수 있음
    }

    handleFile(file);

  }
);


/* =========================
   업로드
========================= */

function uploadFile() {

  if (!selectedFileObject) {

    showMessage(
      uploadMessage,
      "먼저 파일을 선택해주세요.",
      "error"
    );

    return;
  }

  /*
   * 업로드 시작 시 게이지 표시
   */
  progressBox.style.display = "block";

  progress.value = 0;
  progressText.textContent = "0%";
  speedText.textContent = "-";

  hideMessage(uploadMessage);

  uploadButton.disabled = true;
  uploadButton.textContent = "업로드 중...";


  const formData =
    new FormData();

  formData.append(
    "file",
    selectedFileObject
  );


  const xhr =
    new XMLHttpRequest();

  const startTime =
    Date.now();


  xhr.open(
    "POST",
    `${API}/upload`
  );


  /* =========================
     업로드 진행률
  ========================= */

  xhr.upload.onprogress =
    (event) => {

      if (!event.lengthComputable) {
        return;
      }

      const percent =
        Math.round(
          (event.loaded / event.total) * 100
        );

      progress.value = percent;

      progressText.textContent =
        `${percent}%`;


      const elapsed =
        (Date.now() - startTime) / 1000;

      if (elapsed > 0) {

        const speed =
          event.loaded / elapsed;

        speedText.textContent =
          `${formatSize(speed)}/s`;

      }

    };


  /* =========================
     업로드 완료
  ========================= */

  xhr.onload = () => {

    uploadButton.disabled = false;
    uploadButton.textContent = "업로드";


    let result;

    try {

      result =
        JSON.parse(xhr.responseText);

    } catch (error) {

      showMessage(
        uploadMessage,
        "서버 응답을 처리하지 못했습니다.",
        "error"
      );

      progressBox.style.display = "none";

      return;
    }


    if (
      xhr.status >= 200 &&
      xhr.status < 300 &&
      result.ok
    ) {

      showMessage(
        uploadMessage,
        "업로드가 완료되었습니다.",
        "success"
      );


      /*
       * 업로드 완료 후
       * 게이지 전체 삭제
       */
      progressBox.style.display = "none";

      progress.value = 0;
      progressText.textContent = "0%";
      speedText.textContent = "-";


      /*
       * 선택된 파일 초기화
       */
      fileInput.value = "";

      selectedFileObject = null;

      selectedFile.classList.remove("show");
      selectedFile.textContent = "";


      /*
       * 관리자 모드라면
       * 파일 목록 새로고침
       */
      if (adminPassword) {

        loadAdminFiles();

      }

    } else {

      showMessage(
        uploadMessage,
        result.error ||
          "업로드에 실패했습니다.",
        "error"
      );

    }

  };


  /* =========================
     네트워크 오류
  ========================= */

  xhr.onerror = () => {

    uploadButton.disabled = false;
    uploadButton.textContent = "업로드";

    progressBox.style.display = "none";

    showMessage(
      uploadMessage,
      "업로드 중 네트워크 오류가 발생했습니다.",
      "error"
    );

  };


  /* =========================
     업로드 취소
  ========================= */

  xhr.onabort = () => {

    uploadButton.disabled = false;
    uploadButton.textContent = "업로드";

    progressBox.style.display = "none";

    showMessage(
      uploadMessage,
      "업로드가 취소되었습니다.",
      "error"
    );

  };


  xhr.send(formData);

}


uploadButton.addEventListener(
  "click",
  uploadFile
);


/* =========================
   관리자 로그인
========================= */

async function adminLogin() {

  const password =
    prompt("관리자 비밀번호를 입력하세요.");

  if (password === null) {
    return;
  }

  if (!password) {

    showMessage(
      adminMessage,
      "비밀번호를 입력해주세요.",
      "error"
    );

    return;
  }


  showMessage(
    adminMessage,
    "관리자 인증 중..."
  );


  try {

    const response =
      await fetch(
        `${API}/admin/files`,
        {
          method: "GET",

          headers: {
            "X-Admin-Password": password
          }
        }
      );


    const data =
      await response.json();


    if (
      response.ok &&
      data.ok
    ) {

      adminPassword = password;

      sessionStorage.setItem(
        "adminPassword",
        password
      );


      adminPanel.style.display =
        "block";

      hideMessage(adminMessage);

      renderAdminFiles(data.files || []);

    } else {

      showMessage(
        adminMessage,
        data.error ||
          "관리자 인증에 실패했습니다.",
        "error"
      );

    }

  } catch (error) {

    showMessage(
      adminMessage,
      "관리자 서버에 연결하지 못했습니다.",
      "error"
    );

  }

}


adminButton.addEventListener(
  "click",
  adminLogin
);


/* =========================
   관리자 파일 목록
========================= */

async function loadAdminFiles() {

  if (!adminPassword) {
    return;
  }


  adminFiles.innerHTML =
    `<div class="empty-files">불러오는 중...</div>`;


  try {

    const response =
      await fetch(
        `${API}/admin/files`,
        {
          method: "GET",

          headers: {
            "X-Admin-Password":
              adminPassword
          }
        }
      );


    const data =
      await response.json();


    if (
      response.status === 401 ||
      !response.ok ||
      !data.ok
    ) {

      sessionStorage.removeItem(
        "adminPassword"
      );

      adminPassword = "";

      adminPanel.style.display =
        "none";

      showMessage(
        adminMessage,
        "관리자 인증이 만료되었습니다.",
        "error"
      );

      return;
    }


    renderAdminFiles(
      data.files || []
    );

  } catch (error) {

    adminFiles.innerHTML =
      `<div class="empty-files">
        파일 목록을 불러오지 못했습니다.
      </div>`;

  }

}


/* =========================
   관리자 파일 표시
========================= */

function renderAdminFiles(files) {

  /*
   * 파일이 하나도 없어도
   * 관리자 카드 자체는 유지
   */

  if (!files.length) {

    adminFiles.innerHTML =
      `<div class="empty-files">
        현재 업로드된 파일이 없습니다.
      </div>`;

    return;
  }


  const list =
    document.createElement("div");

  list.className =
    "admin-file-list";


  files.forEach((file) => {

    const item =
      document.createElement("div");

    item.className =
      "admin-file";


    const info =
      document.createElement("div");

    info.className =
      "admin-file-info";


    const name =
      document.createElement("div");

    name.className =
      "admin-file-name";

    name.textContent =
      file.name;


    const size =
      document.createElement("div");

    size.className =
      "admin-file-size";

    size.textContent =
      formatSize(file.size);


    info.appendChild(name);
    info.appendChild(size);


    const actions =
      document.createElement("div");

    actions.className =
      "admin-file-actions";


    const downloadButton =
      document.createElement("button");

    downloadButton.className =
      "download-button";

    downloadButton.textContent =
      "다운로드";


    downloadButton.addEventListener(
      "click",
      () => downloadFile(file.name)
    );


    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "delete-button";

    deleteButton.textContent =
      "삭제";


    deleteButton.addEventListener(
      "click",
      () => deleteFile(file.name)
    );


    actions.appendChild(
      downloadButton
    );

    actions.appendChild(
      deleteButton
    );


    item.appendChild(info);
    item.appendChild(actions);

    list.appendChild(item);

  });


  adminFiles.innerHTML = "";

  adminFiles.appendChild(list);

}


/* =========================
   관리자 다운로드
========================= */

async function downloadFile(filename) {

  try {

    const response =
      await fetch(
        `${API}/admin/download?name=${encodeURIComponent(filename)}`,
        {
          method: "GET",

          headers: {
            "X-Admin-Password":
              adminPassword
          }
        }
      );


    if (!response.ok) {

      let errorMessage =
        "다운로드에 실패했습니다.";

      try {

        const data =
          await response.json();

        if (data.error) {
          errorMessage =
            data.error;
        }

      } catch (error) {
        // JSON이 아닐 경우 기본 메시지 사용
      }

      alert(errorMessage);

      return;
    }


    const blob =
      await response.blob();


    /*
     * 새 창으로 열지 않고
     * 브라우저 다운로드 실행
     */

    const blobUrl =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");

    link.href =
      blobUrl;

    link.download =
      filename;

    document.body.appendChild(link);

    link.click();

    link.remove();


    setTimeout(() => {

      URL.revokeObjectURL(blobUrl);

    }, 1000);


  } catch (error) {

    alert(
      "다운로드 중 오류가 발생했습니다."
    );

  }

}


/* =========================
   관리자 삭제
========================= */

async function deleteFile(filename) {

  const confirmed =
    confirm(
      `"${filename}" 파일을 삭제하시겠습니까?`
    );


  if (!confirmed) {
    return;
  }


  try {

    const response =
      await fetch(
        `${API}/admin/delete?name=${encodeURIComponent(filename)}`,
        {
          method: "DELETE",

          headers: {
            "X-Admin-Password":
              adminPassword
          }
        }
      );


    const data =
      await response.json();


    if (
      response.ok &&
      data.ok
    ) {

      await loadAdminFiles();

    } else {

      if (response.status === 401) {

        sessionStorage.removeItem(
          "adminPassword"
        );

        adminPassword = "";

        adminPanel.style.display =
          "none";

      }


      alert(
        data.error ||
          "파일 삭제에 실패했습니다."
      );

    }

  } catch (error) {

    alert(
      "삭제 중 오류가 발생했습니다."
    );

  }

}


/* =========================
   로그아웃
========================= */

logoutButton.addEventListener(
  "click",
  () => {

    adminPassword = "";

    sessionStorage.removeItem(
      "adminPassword"
    );

    adminPanel.style.display =
      "none";

    hideMessage(adminMessage);

  }
);


/* =========================
   새로고침 시 관리자 세션 확인
========================= */

if (adminPassword) {

  adminPanel.style.display =
    "block";

  loadAdminFiles();

}

</script>
