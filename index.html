<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>파일 업로드</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans KR",
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f7f9fc 0%,
          #eef2f7 100%
        );

      color:
        #1f2937;
    }


    .container {

      width:
        min(
          680px,
          calc(100% - 32px)
        );

      margin:
        0 auto;

      padding:
        60px 0 50px;
    }


    /* =========================
       헤더
    ========================= */

    .header {

      text-align:
        center;

      margin-bottom:
        30px;
    }


    .logo {

      width:
        58px;

      height:
        58px;

      margin:
        0 auto 18px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      border-radius:
        18px;

      background:
        #111827;

      color:
        white;

      font-size:
        25px;

      font-weight:
        700;

      box-shadow:
        0 10px 25px
        rgba(
          17,
          24,
          39,
          0.18
        );
    }


    h1 {

      margin:
        0 0 8px;

      font-size:
        30px;

      font-weight:
        750;

      letter-spacing:
        -0.8px;

      color:
        #111827;
    }


    .subtitle {

      margin:
        0;

      color:
        #6b7280;

      font-size:
        15px;
    }


    /* =========================
       카드
    ========================= */

    .card {

      background:
        rgba(
          255,
          255,
          255,
          0.95
        );

      border:
        1px solid
        rgba(
          229,
          231,
          235,
          0.9
        );

      border-radius:
        22px;

      padding:
        28px;

      box-shadow:
        0 12px 35px
        rgba(
          15,
          23,
          42,
          0.07
        );
    }


    /* =========================
       드래그 앤 드롭
    ========================= */

    .drop-area {

      display:
        block;

      border:
        2px dashed
        #d1d5db;

      border-radius:
        18px;

      padding:
        38px 20px;

      text-align:
        center;

      transition:
        0.2s ease;

      cursor:
        pointer;

      background:
        #fafafa;
    }


    .drop-area:hover {

      border-color:
        #9ca3af;

      background:
        #f8fafc;
    }


    .drop-area.dragover {

      border-color:
        #111827;

      background:
        #f0f2f5;

      transform:
        scale(1.01);
    }


    .upload-icon {

      width:
        52px;

      height:
        52px;

      margin:
        0 auto 14px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      border-radius:
        15px;

      background:
        #111827;

      color:
        white;

      font-size:
        25px;
    }


    .drop-title {

      font-size:
        16px;

      font-weight:
        650;

      color:
        #374151;

      margin-bottom:
        7px;
    }


    .drop-description {

      font-size:
        13px;

      color:
        #9ca3af;
    }


    #fileInput {

      display:
        none;
    }


    /* =========================
       선택된 파일
    ========================= */

    .selected-file {

      display:
        none;

      margin-top:
        16px;

      padding:
        13px 15px;

      background:
        #f3f4f6;

      border-radius:
        12px;

      font-size:
        13px;

      color:
        #4b5563;

      word-break:
        break-all;
    }


    /* =========================
       버튼
    ========================= */

    .button {

      width:
        100%;

      margin-top:
        18px;

      padding:
        14px 18px;

      border:
        none;

      border-radius:
        13px;

      background:
        #111827;

      color:
        white;

      font-size:
        15px;

      font-weight:
        650;

      cursor:
        pointer;

      transition:
        0.15s ease;
    }


    .button:hover {

      background:
        #1f2937;

      transform:
        translateY(-1px);

      box-shadow:
        0 7px 18px
        rgba(
          17,
          24,
          39,
          0.16
        );
    }


    .button:active {

      transform:
        translateY(0);
    }


    .button:disabled {

      opacity:
        0.5;

      cursor:
        not-allowed;

      transform:
        none;

      box-shadow:
        none;
    }


    /* =========================
       진행률
    ========================= */

    #progressBox {

      display:
        none;

      margin-top:
        22px;
    }


    .progress-header {

      display:
        flex;

      justify-content:
        space-between;

      margin-bottom:
        8px;

      font-size:
        13px;

      color:
        #6b7280;
    }


    progress {

      width:
        100%;

      height:
        9px;

      border:
        none;

      appearance:
        none;

      -webkit-appearance:
        none;
    }


    progress::-webkit-progress-bar {

      background:
        #e5e7eb;

      border-radius:
        999px;
    }


    progress::-webkit-progress-value {

      background:
        #111827;

      border-radius:
        999px;
    }


    progress::-moz-progress-bar {

      background:
        #111827;

      border-radius:
        999px;
    }


    .speed {

      margin-top:
        8px;

      text-align:
        right;

      font-size:
        12px;

      color:
        #9ca3af;
    }


    /* =========================
       메시지
    ========================= */

    .message {

      display:
        none;

      margin-top:
        15px;

      padding:
        13px 15px;

      border-radius:
        12px;

      font-size:
        14px;

      line-height:
        1.5;
    }


    .success {

      background:
        #ecfdf5;

      color:
        #047857;

      border:
        1px solid
        #a7f3d0;
    }


    .error {

      background:
        #fef2f2;

      color:
        #b91c1c;

      border:
        1px solid
        #fecaca;
    }


    /* =========================
       관리자 버튼
    ========================= */

    .admin-section {

      margin-top:
        18px;

      text-align:
        center;
    }


    .admin-button {

      border:
        none;

      background:
        transparent;

      color:
        #9ca3af;

      font-size:
        12px;

      cursor:
        pointer;

      padding:
        8px 12px;

      border-radius:
        8px;
    }


    .admin-button:hover {

      background:
        #f3f4f6;

      color:
        #4b5563;
    }


    /* =========================
       관리자 패널
    ========================= */

    #adminPanel {

      display:
        none;

      margin-top:
        18px;
    }


    .admin-header {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap:
        15px;

      margin-bottom:
        20px;
    }


    .admin-title {

      margin:
        0;

      font-size:
        18px;

      font-weight:
        700;

      color:
        #111827;
    }


    .admin-badge {

      display:
        inline-block;

      margin-top:
        5px;

      padding:
        4px 8px;

      border-radius:
        999px;

      background:
        #ecfdf5;

      color:
        #047857;

      font-size:
        11px;

      font-weight:
        600;
    }


    .logout-button {

      border:
        none;

      background:
        #f3f4f6;

      color:
        #4b5563;

      padding:
        8px 12px;

      border-radius:
        9px;

      cursor:
        pointer;

      font-size:
        12px;
    }


    .logout-button:hover {

      background:
        #e5e7eb;
    }


    /* =========================
       관리자 파일
    ========================= */

    .admin-file {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        15px;

      padding:
        15px 0;

      border-bottom:
        1px solid
        #f0f0f0;
    }


    .admin-file:last-child {

      border-bottom:
        none;
    }


    .admin-file-name {

      font-size:
        14px;

      word-break:
        break-all;
    }


    .admin-file-size {

      margin-top:
        4px;

      color:
        #9ca3af;

      font-size:
        12px;
    }


    .admin-actions {

      display:
        flex;

      gap:
        6px;

      flex-shrink:
        0;
    }


    .small-button {

      border:
        none;

      padding:
        8px 11px;

      border-radius:
        8px;

      color:
        white;

      cursor:
        pointer;

      font-size:
        12px;
    }


    .download {

      background:
        #2563eb;
    }


    .download:hover {

      background:
        #1d4ed8;
    }


    .delete {

      background:
        #ef4444;
    }


    .delete:hover {

      background:
        #dc2626;
    }


    .empty {

      padding:
        30px 10px;

      text-align:
        center;

      color:
        #9ca3af;

      font-size:
        14px;
    }


    /* =========================
       모바일
    ========================= */

    @media (
      max-width: 600px
    ) {

      .container {

        width:
          calc(100% - 22px);

        padding-top:
          40px;
      }


      .card {

        padding:
          20px;

        border-radius:
          18px;
      }


      h1 {

        font-size:
          26px;
      }


      .drop-area {

        padding:
          30px 15px;
      }


      .admin-file {

        align-items:
          flex-start;

        flex-direction:
          column;
      }


      .admin-actions {

        width:
          100%;
      }


      .small-button {

        flex:
          1;
      }


      .admin-header {

        align-items:
          flex-start;
      }
    }

  </style>

</head>


<body>


<div class="container">


  <!-- =========================
       헤더
  ========================== -->

  <div class="header">

    <div class="logo">
      ↑
    </div>

    <h1>
      파일 업로드
    </h1>

    <p class="subtitle">
      파일을 선택하거나 끌어다 놓아 업로드하세요.
    </p>

  </div>


  <!-- =========================
       업로드 카드
  ========================== -->

  <div class="card">


    <label
      id="dropArea"
      class="drop-area"
      for="fileInput">


      <div class="upload-icon">
        ↑
      </div>


      <div class="drop-title">

        파일을 선택하세요

      </div>


      <div class="drop-description">

        클릭하거나 파일을 이곳으로 끌어다 놓으세요.

      </div>


    </label>


    <input
      type="file"
      id="fileInput"
    >


    <div
      id="selectedFile"
      class="selected-file">
    </div>


    <button
      id="uploadButton"
      class="button">

      업로드

    </button>


    <!-- 진행률 -->

    <div
      id="progressBox">


      <div
        class="progress-header">

        <span>
          업로드 중
        </span>


        <span
          id="progressText">

          0%

        </span>

      </div>


      <progress
        id="progress"
        value="0"
        max="100">
      </progress>


      <div
        id="speedText"
        class="speed">

        -

      </div>


    </div>


    <div
      id="uploadMessage"
      class="message">
    </div>


  </div>


  <!-- =========================
       관리자 버튼
  ========================== -->

  <div
    class="admin-section">


    <button
      id="adminButton"
      class="admin-button">

      관리자 모드

    </button>


  </div>


  <div
    id="adminMessage"
    class="message">
  </div>


  <!-- =========================
       관리자 패널
  ========================== -->

  <div
    id="adminPanel"
    class="card">


    <div
      class="admin-header">


      <div>

        <div
          class="admin-title">

          관리자 파일 관리

        </div>


        <div
          class="admin-badge">

          관리자 인증됨

        </div>

      </div>


      <button
        id="logoutButton"
        class="logout-button">

        로그아웃

      </button>


    </div>


    <div
      id="adminFiles">

      불러오는 중...

    </div>


  </div>


</div>


<script>


/* ==================================================
   API
================================================== */

const API =
  "https://files.hjcone.workers.dev";


/* ==================================================
   DOM
================================================== */

const fileInput =
  document.getElementById(
    "fileInput"
  );


const dropArea =
  document.getElementById(
    "dropArea"
  );


/* ==================================================
   메시지
================================================== */

function showMessage(
  element,
  message,
  type
) {

  element.textContent =
    message;

  element.className =
    "message " + type;

  element.style.display =
    "block";
}


function hideMessage(
  element
) {

  element.style.display =
    "none";
}


/* ==================================================
   파일 크기
================================================== */

function formatSize(
  bytes
) {

  if (!bytes) {
    return "0 B";
  }


  const units = [
    "B",
    "KB",
    "MB",
    "GB",
    "TB"
  ];


  let size =
    bytes;


  let index =
    0;


  while (
    size >= 1024 &&
    index <
      units.length - 1
  ) {

    size /=
      1024;

    index++;
  }


  return (
    size.toFixed(
      index === 0
        ? 0
        : 1
    )
    +
    " "
    +
    units[index]
  );
}


/* ==================================================
   파일 선택 처리
================================================== */

function handleFile(
  file
) {

  if (!file) {
    return;
  }


  const selected =
    document.getElementById(
      "selectedFile"
    );


  selected.textContent =
    `선택된 파일 · ${file.name} · ${formatSize(file.size)}`;


  selected.style.display =
    "block";


  hideMessage(
    document.getElementById(
      "uploadMessage"
    )
  );
}


/* ==================================================
   일반 파일 선택
================================================== */

fileInput.addEventListener(
  "change",
  function() {

    const file =
      fileInput.files[0];


    if (file) {

      handleFile(
        file
      );
    }
  }
);


/* ==================================================
   드래그 앤 드롭
================================================== */


/*
 * 드래그가 영역 안으로 들어왔을 때
 */
dropArea.addEventListener(
  "dragenter",
  function(event) {

    event.preventDefault();

    event.stopPropagation();

    dropArea.classList.add(
      "dragover"
    );
  }
);


/*
 * 드래그 중
 */
dropArea.addEventListener(
  "dragover",
  function(event) {

    event.preventDefault();

    event.stopPropagation();

    dropArea.classList.add(
      "dragover"
    );
  }
);


/*
 * 드래그 영역 밖으로 나갔을 때
 */
dropArea.addEventListener(
  "dragleave",
  function(event) {

    event.preventDefault();

    event.stopPropagation();

    /*
     * 실제 영역 밖으로 나간 경우에만 제거
     */
    if (
      event.target ===
      dropArea
    ) {

      dropArea.classList.remove(
        "dragover"
      );
    }
  }
);


/*
 * 파일을 놓았을 때
 */
dropArea.addEventListener(
  "drop",
  function(event) {

    event.preventDefault();

    event.stopPropagation();


    dropArea.classList.remove(
      "dragover"
    );


    const files =
      event.dataTransfer.files;


    if (
      !files ||
      files.length === 0
    ) {
      return;
    }


    /*
     * 첫 번째 파일만 사용
     */
    const file =
      files[0];


    /*
     * input에도 넣어줌
     */
    try {

      const dataTransfer =
        new DataTransfer();

      dataTransfer.items.add(
        file
      );

      fileInput.files =
        dataTransfer.files;

    } catch (_) {

      /*
       * 일부 오래된 브라우저에서는
       * input.files 설정을 지원하지 않을 수 있음
       */
    }


    handleFile(
      file
    );
  }
);


/* ==================================================
   업로드
================================================== */

document
  .getElementById(
    "uploadButton"
  )
  .addEventListener(
    "click",
    uploadFile
  );


function uploadFile() {


  const file =
    fileInput.files[0];


  const button =
    document.getElementById(
      "uploadButton"
    );


  const progressBox =
    document.getElementById(
      "progressBox"
    );


  const progress =
    document.getElementById(
      "progress"
    );


  const progressText =
    document.getElementById(
      "progressText"
    );


  const speedText =
    document.getElementById(
      "speedText"
    );


  const message =
    document.getElementById(
      "uploadMessage"
    );


  /*
   * 파일이 없는 경우
   */
  if (!file) {

    showMessage(
      message,

      "먼저 업로드할 파일을 선택해주세요.",

      "error"
    );

    return;
  }


  /*
   * 버튼 비활성화
   */
  button.disabled =
    true;


  button.textContent =
    "업로드 중...";


  progressBox.style.display =
    "block";


  progress.value =
    0;


  progressText.textContent =
    "0%";


  speedText.textContent =
    "-";


  hideMessage(
    message
  );


  /*
   * FormData
   */
  const formData =
    new FormData();


  formData.append(
    "file",
    file
  );


  /*
   * XMLHttpRequest
   *
   * fetch보다 업로드 진행률을
   * 정확하게 표시할 수 있습니다.
   */
  const xhr =
    new XMLHttpRequest();


  const startTime =
    Date.now();


  xhr.open(
    "POST",
    `${API}/upload`
  );


  /*
   * 업로드 진행률
   */
  xhr.upload.onprogress =
    function(event) {

      if (
        !event.lengthComputable
      ) {

        return;
      }


      const percent =
        Math.round(
          (
            event.loaded /
            event.total
          ) *
          100
        );


      progress.value =
        percent;


      progressText.textContent =
        `${percent}%`;


      const elapsed =
        (
          Date.now() -
          startTime
        ) / 1000;


      if (
        elapsed > 0
      ) {

        const speed =
          event.loaded /
          elapsed;


        speedText.textContent =
          `속도 ${formatSize(speed)}/s`;
      }
    };


  /*
   * 업로드 완료
   */
  xhr.onload =
    function() {


      button.disabled =
        false;


      button.textContent =
        "업로드";


      try {

        const data =
          JSON.parse(
            xhr.responseText
          );


        if (
          xhr.status < 200 ||
          xhr.status >= 300 ||
          !data.ok
        ) {

          throw new Error(
            data.error ||
            "업로드에 실패했습니다."
          );
        }


        progress.value =
          100;


        progressText.textContent =
          "100%";


        showMessage(
          message,

          `${data.name} 업로드가 완료되었습니다.`,

          "success"
        );


        /*
         * 파일 선택 초기화
         */
        fileInput.value =
          "";


        document
          .getElementById(
            "selectedFile"
          )
          .style.display =
          "none";


        /*
         * 관리자 로그인 중이면
         * 관리자 목록 새로고침
         */
        if (
          sessionStorage.getItem(
            "adminPassword"
          )
        ) {

          loadAdminFiles();
        }


      } catch (error) {

        showMessage(
          message,

          error.message,

          "error"
        );
      }
    };


  /*
   * 네트워크 오류
   */
  xhr.onerror =
    function() {


      button.disabled =
        false;


      button.textContent =
        "업로드";


      showMessage(
        message,

        "서버와 통신하지 못했습니다.",

        "error"
      );
    };


  /*
   * 요청
   */
  xhr.send(
    formData
  );
}


/* ==================================================
   관리자 로그인
================================================== */

document
  .getElementById(
    "adminButton"
  )
  .addEventListener(
    "click",
    adminLogin
  );


async function adminLogin() {


  const password =
    prompt(
      "관리자 비밀번호를 입력하세요."
    );


  if (
    password === null
  ) {

    return;
  }


  if (!password) {

    showMessage(

      document.getElementById(
        "adminMessage"
      ),

      "비밀번호를 입력해주세요.",

      "error"
    );

    return;
  }


  const message =
    document.getElementById(
      "adminMessage"
    );


  hideMessage(
    message
  );


  try {


    const response =
      await fetch(

        `${API}/admin/files`,

        {

          method:
            "GET",

          headers: {

            "X-Admin-Password":
              password
          }
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.error ||
        "관리자 인증에 실패했습니다."
      );
    }


    /*
     * 관리자 비밀번호를
     * 현재 브라우저 세션에만 저장
     */
    sessionStorage.setItem(
      "adminPassword",
      password
    );


    /*
     * 관리자 카드 표시
     */
    document
      .getElementById(
        "adminPanel"
      )
      .style.display =
      "block";


    showMessage(

      message,

      "관리자 인증이 완료되었습니다.",

      "success"
    );


    /*
     * 파일이 0개여도
     * 관리자 카드가 표시됨
     */
    renderAdminFiles(
      data.files
    );


  } catch (error) {


    sessionStorage.removeItem(
      "adminPassword"
    );


    showMessage(

      message,

      "관리자 로그인 실패: " +
      error.message,

      "error"
    );


    console.error(
      "ADMIN LOGIN ERROR:",
      error
    );
  }
}


/* ==================================================
   관리자 파일 목록 가져오기
================================================== */

async function loadAdminFiles() {


  const password =
    sessionStorage.getItem(
      "adminPassword"
    );


  if (!password) {

    return;
  }


  try {


    const response =
      await fetch(

        `${API}/admin/files`,

        {

          headers: {

            "X-Admin-Password":
              password
          }
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok
    ) {


      sessionStorage.removeItem(
        "adminPassword"
      );


      document
        .getElementById(
          "adminPanel"
        )
        .style.display =
        "none";


      throw new Error(
        data.error ||
        "관리자 인증이 만료되었습니다."
      );
    }


    renderAdminFiles(
      data.files
    );


  } catch (error) {

    console.error(
      "ADMIN FILE ERROR:",
      error
    );
  }
}


/* ==================================================
   관리자 파일 표시
================================================== */

function renderAdminFiles(
  files
) {


  const container =
    document.getElementById(
      "adminFiles"
    );


  container.innerHTML =
    "";


  /*
   * 파일이 없을 때도
   * 관리자 카드 안에서 메시지 표시
   */
  if (
    !files ||
    files.length === 0
  ) {


    container.innerHTML = `

      <div class="empty">

        현재 업로드된 파일이 없습니다.

      </div>

    `;


    return;
  }


  /*
   * 파일 목록
   */
  files.forEach(
    function(file) {


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "admin-file";


      /*
       * 파일 정보
       */
      const info =
        document.createElement(
          "div"
        );


      info.style.flex =
        "1";


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "admin-file-name";


      name.textContent =
        file.name;


      const size =
        document.createElement(
          "div"
        );


      size.className =
        "admin-file-size";


      size.textContent =
        formatSize(
          file.size
        );


      info.appendChild(
        name
      );


      info.appendChild(
        size
      );


      /*
       * 버튼
       */
      const actions =
        document.createElement(
          "div"
        );


      actions.className =
        "admin-actions";


      /*
       * 다운로드
       */
      const download =
        document.createElement(
          "button"
        );


      download.className =
        "small-button download";


      download.textContent =
        "다운로드";


      download.onclick =
        function() {

          downloadFile(
            file.name
          );
        };


      /*
       * 삭제
       */
      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.className =
        "small-button delete";


      deleteButton.textContent =
        "삭제";


      deleteButton.onclick =
        function() {

          deleteFile(
            file.name
          );
        };


      actions.appendChild(
        download
      );


      actions.appendChild(
        deleteButton
      );


      row.appendChild(
        info
      );


      row.appendChild(
        actions
      );


      container.appendChild(
        row
      );

    }
  );
}


/* ==================================================
   관리자 다운로드
================================================== */

async function downloadFile(
  filename
) {


  const password =
    sessionStorage.getItem(
      "adminPassword"
    );


  if (!password) {

    return;
  }


  try {


    /*
     * Worker에서 실제 파일을 가져옴
     */
    const response =
      await fetch(

        `${API}/admin/download?name=${encodeURIComponent(filename)}`,

        {

          method:
            "GET",

          headers: {

            "X-Admin-Password":
              password
          }
        }
      );


    if (
      !response.ok
    ) {


      let errorMessage =
        "다운로드에 실패했습니다.";


      try {

        const data =
          await response.json();


        if (
          data.error
        ) {

          errorMessage =
            data.error;
        }

      } catch (_) {}


      throw new Error(
        errorMessage
      );
    }


    /*
     * 실제 파일 데이터를 Blob으로 변환
     */
    const blob =
      await response.blob();


    /*
     * 임시 다운로드 URL
     */
    const blobUrl =
      URL.createObjectURL(
        blob
      );


    /*
     * 브라우저 다운로드
     */
    const link =
      document.createElement(
        "a"
      );


    link.href =
      blobUrl;


    link.download =
      filename;


    link.style.display =
      "none";


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    /*
     * 임시 URL 삭제
     */
    setTimeout(
      function() {

        URL.revokeObjectURL(
          blobUrl
        );

      },
      1000
    );


  } catch (error) {


    alert(
      "다운로드 실패: " +
      error.message
    );
  }
}


/* ==================================================
   관리자 삭제
================================================== */

async function deleteFile(
  filename
) {


  const password =
    sessionStorage.getItem(
      "adminPassword"
    );


  if (!password) {

    return;
  }


  const confirmed =
    confirm(

      `"${filename}" 파일을 삭제하시겠습니까?`

    );


  if (!confirmed) {

    return;
  }


  try {


    const response =
      await fetch(

        `${API}/admin/delete?name=${encodeURIComponent(filename)}`,

        {

          method:
            "DELETE",

          headers: {

            "X-Admin-Password":
              password
          }
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.error ||
        "삭제에 실패했습니다."
      );
    }


    /*
     * 삭제 후 목록 새로고침
     *
     * 파일이 0개가 되어도
     * 관리자 카드는 그대로 유지됨
     */
    await loadAdminFiles();


  } catch (error) {


    alert(
      "삭제 실패: " +
      error.message
    );
  }
}


/* ==================================================
   관리자 로그아웃
================================================== */

document

  )
  .addEventListener(

        ),
