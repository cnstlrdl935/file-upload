<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>파일 업로드</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      width: min(700px, calc(100% - 32px));
      margin: 60px auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .description {
      margin: 0 0 25px;
      color: #666;
    }

    .drop-zone {
      border: 2px dashed #aaa;
      border-radius: 14px;
      padding: 45px 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      background: #fafafa;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: #333;
      background: #f0f0f0;
    }

    .drop-zone strong {
      display: block;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .drop-zone span {
      color: #777;
      font-size: 14px;
    }

    #fileInput {
      display: none;
    }

    .file-list {
      margin-top: 25px;
    }

    .file-item {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      background: #fff;
    }

    .file-name {
      font-weight: bold;
      word-break: break-all;
      margin-bottom: 6px;
    }

    .file-size {
      font-size: 13px;
      color: #777;
      margin-bottom: 10px;
    }

    .progress-container {
      width: 100%;
      height: 8px;
      background: #e5e5e5;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: #333;
      transition: width 0.2s;
    }

    .status {
      margin-top: 8px;
      font-size: 14px;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #d32f2f;
    }

    .upload-button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .upload-button:hover {
      background: #444;
    }

    .upload-button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .clear-button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
      color: #333;
      cursor: pointer;
    }

    .server-status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #f1f1f1;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .container {
        margin: 25px auto;
      }

      .card {
        padding: 20px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>파일 업로드</h1>

      <p class="description">
        업로드할 파일을 선택하거나 이곳에 끌어다 놓으세요.
      </p>

      <div class="drop-zone" id="dropZone">
        <strong>파일을 선택하세요</strong>
        <span>클릭하거나 파일을 드래그해서 업로드할 수 있습니다.</span>
      </div>

      <input
        type="file"
        id="fileInput"
        multiple
      >

      <div class="file-list" id="fileList"></div>

      <button
        class="upload-button"
        id="uploadButton"
        disabled
      >
        파일 업로드
      </button>

      <button
        class="clear-button"
        id="clearButton"
      >
        선택한 파일 모두 지우기
      </button>

      <div
        class="server-status"
        id="serverStatus"
      >
        서버 연결 확인 중...
      </div>

    </div>

  </div>


  <script>

    // Cloudflare Worker 주소
    const API = "https://files.hjcone.worker.dev";


    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const fileList = document.getElementById("fileList");
    const uploadButton = document.getElementById("uploadButton");
    const clearButton = document.getElementById("clearButton");
    const serverStatus = document.getElementById("serverStatus");


    let selectedFiles = [];


    // --------------------------------
    // 파일 크기 표시
    // --------------------------------

    function formatFileSize(bytes) {

      if (bytes < 1024) {
        return bytes + " B";
      }

      if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(1) + " KB";
      }

      if (bytes < 1024 * 1024 * 1024) {
        return (bytes / (1024 * 1024)).toFixed(2) + " MB";
      }

      return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
    }


    // --------------------------------
    // 파일 선택
    // --------------------------------

    fileInput.addEventListener("change", function () {

      addFiles(Array.from(fileInput.files));

      fileInput.value = "";

    });


    // --------------------------------
    // 드롭 영역 클릭
    // --------------------------------

    dropZone.addEventListener("click", function () {

      fileInput.click();

    });


    // --------------------------------
    // 드래그 앤 드롭
    // --------------------------------

    dropZone.addEventListener("dragover", function (event) {

      event.preventDefault();

      dropZone.classList.add("dragover");

    });


    dropZone.addEventListener("dragleave", function () {

      dropZone.classList.remove("dragover");

    });


    dropZone.addEventListener("drop", function (event) {

      event.preventDefault();

      dropZone.classList.remove("dragover");

      const files = Array.from(event.dataTransfer.files);

      addFiles(files);

    });


    // --------------------------------
    // 파일 추가
    // --------------------------------

    function addFiles(files) {

      if (!files || files.length === 0) {
        return;
      }

      selectedFiles.push(...files);

      renderFileList();

    }


    // --------------------------------
    // 파일 목록 표시
    // --------------------------------

    function renderFileList() {

      fileList.innerHTML = "";

      selectedFiles.forEach((file, index) => {

        const item = document.createElement("div");

        item.className = "file-item";

        item.innerHTML = `
          <div class="file-name"></div>

          <div class="file-size"></div>

          <div class="progress-container">
            <div
              class="progress"
              id="progress-${index}"
            ></div>
          </div>

          <div
            class="status"
            id="status-${index}"
          >
            업로드 대기 중
          </div>
        `;

        item.querySelector(".file-name").textContent = file.name;

        item.querySelector(".file-size").textContent =
          formatFileSize(file.size);

        fileList.appendChild(item);

      });


      uploadButton.disabled = selectedFiles.length === 0;

    }


    // --------------------------------
    // 파일을 Base64로 변환
    // --------------------------------

    function fileToBase64(file) {

      return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = function () {
          resolve(reader.result);
        };

        reader.onerror = function () {
          reject(new Error("파일을 읽을 수 없습니다."));
        };

        reader.readAsDataURL(file);

      });

    }


    // --------------------------------
    // 업로드
    // --------------------------------

    async function uploadFile(file, index) {

      const progress = document.getElementById(
        `progress-${index}`
      );

      const status = document.getElementById(
        `status-${index}`
      );


      try {

        status.textContent = "파일을 읽는 중...";
        status.className = "status";

        progress.style.width = "20%";


        // Base64 변환
        const base64 = await fileToBase64(file);


        progress.style.width = "50%";

        status.textContent = "서버에 업로드하는 중...";


        // FormData 생성
        const formData = new FormData();

        formData.append(
          "fileName",
          file.name
        );

        formData.append(
          "fileData",
          base64.split(",")[1]
        );


        // Worker 요청
        const response = await fetch(
          API + "/upload",
          {
            method: "POST",
            body: formData
          }
        );


        progress.style.width = "80%";


        let result;

        try {

          result = await response.json();

        } catch (error) {

          throw new Error(
            "서버에서 올바른 응답을 받지 못했습니다."
          );

        }


        if (!response.ok || !result.success) {

          let message =
            result.error ||
            "업로드에 실패했습니다.";

          if (result.githubStatus) {

            message +=
              ` (GitHub 오류 ${result.githubStatus})`;

          }

          throw new Error(message);

        }


        progress.style.width = "100%";

        status.textContent =
          "업로드 성공";

        status.className =
          "status success";


      } catch (error) {

        progress.style.width = "0%";

        status.textContent =
          "업로드 실패: " +
          (error.message || "알 수 없는 오류");

        status.className =
          "status error";


        console.error(
          "업로드 오류:",
          error
        );

      }

    }


    // --------------------------------
    // 전체 업로드
    // --------------------------------

    uploadButton.addEventListener(
      "click",
      async function () {

        if (selectedFiles.length === 0) {
          return;
        }


        uploadButton.disabled = true;

        clearButton.disabled = true;


        for (
          let i = 0;
          i < selectedFiles.length;
          i++
        ) {

          await uploadFile(
            selectedFiles[i],
            i
          );

        }


        uploadButton.disabled =
          selectedFiles.length === 0;

        clearButton.disabled = false;

      }
    );


    // --------------------------------
    // 선택한 파일 삭제
    // --------------------------------

    clearButton.addEventListener(
      "click",
      function () {

        selectedFiles = [];

        renderFileList();

      }
    );


    // --------------------------------
    // 서버 연결 확인
    // --------------------------------

    async function checkServer() {

      try {

        const response = await fetch(
          API + "/",
          {
            method: "GET"
          }
        );


        if (!response.ok) {
          throw new Error(
            "서버 응답 오류"
          );
        }


        const result =
          await response.json();


        if (result.success) {

          serverStatus.textContent =
            "서버 연결 정상";

          serverStatus.style.color =
            "#16803c";

        } else {

          throw new Error(
            "서버 응답이 올바르지 않습니다."
          );

        }


      } catch (error) {

        serverStatus.textContent =
          "서버 연결 실패: " +
          error.message;

        serverStatus.style.color =
          "#d32f2f";


        console.error(
          "서버 연결 오류:",
          error
        );

      }

    }


    // 처음 실행
    checkServer();

  </script>

</body>
</html>
