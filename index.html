<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>파일 업로드</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;

      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

      background: #f5f5f5;

      color: #222;
    }

    .container {
      width: 100%;
      max-width: 700px;

      margin: 40px auto;

      padding: 30px;

      background: white;

      border-radius: 16px;

      box-shadow:
        0 5px 25px
        rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
    }

    .file-box {
      padding: 25px;

      border: 2px dashed #bbb;

      border-radius: 12px;

      text-align: center;
    }

    input[type="file"] {
      width: 100%;
    }

    .selected-file {
      margin-top: 15px;

      color: #555;

      word-break: break-all;
    }

    button {
      width: 100%;

      padding: 14px;

      margin-top: 15px;

      border: 0;

      border-radius: 10px;

      background: #222;

      color: white;

      font-size: 16px;

      cursor: pointer;
    }

    button:disabled {
      background: #999;

      cursor: not-allowed;
    }

    .progress-area {
      display: none;

      margin-top: 25px;
    }

    .progress-bar {
      width: 100%;

      height: 18px;

      background: #ddd;

      border-radius: 10px;

      overflow: hidden;
    }

    .progress-fill {
      width: 0%;

      height: 100%;

      background: #222;

      transition:
        width 0.15s linear;
    }

    .progress-text {
      margin-top: 10px;

      font-size: 14px;

      line-height: 1.6;
    }

    .message {
      display: none;

      margin-bottom: 20px;

      padding: 14px;

      border-radius: 10px;

      line-height: 1.5;

      word-break: break-word;
    }

    .success {
      display: block;

      background: #e8f7e8;

      color: #176b17;
    }

    .error {
      display: block;

      background: #fdeaea;

      color: #a11;
    }

    .files {
      margin-top: 30px;
    }

    .file-item {
      display: flex;

      align-items: center;

      gap: 12px;

      padding: 12px;

      margin-top: 8px;

      background: #f3f3f3;

      border-radius: 10px;
    }

    .file-info {
      flex: 1;

      min-width: 0;
    }

    .file-name {
      font-weight: bold;

      word-break: break-all;
    }

    .file-size {
      margin-top: 4px;

      font-size: 12px;

      color: #777;
    }

    .admin-button {
      background: #555;

      margin-top: 25px;
    }

    .admin-panel {
      display: none;

      margin-top: 30px;

      padding-top: 25px;

      border-top: 2px solid #ddd;
    }

    .admin-title {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;
    }

    .admin-title h2 {
      margin: 0;
    }

    .logout-button {
      width: auto;

      margin: 0;

      padding: 8px 12px;

      background: #777;

      font-size: 13px;
    }

    .admin-file-item {
      display: flex;

      align-items: center;

      gap: 10px;

      padding: 12px;

      margin-top: 8px;

      background: #f3f3f3;

      border-radius: 10px;
    }

    .admin-file-info {
      flex: 1;

      min-width: 0;
    }

    .admin-file-name {
      font-weight: bold;

      word-break: break-all;
    }

    .admin-file-size {
      margin-top: 4px;

      font-size: 12px;

      color: #777;
    }

    .admin-action {
      width: auto;

      margin: 0;

      padding: 8px 12px;

      font-size: 13px;
    }

    .download-button {
      background: #333;
    }

    .delete-button {
      background: #c62828;
    }

    .empty {
      padding: 20px;

      text-align: center;

      color: #777;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>파일 업로드</h1>


  <!-- ============================= -->
  <!-- 메시지 -->
  <!-- ============================= -->

  <div
    id="message"
    class="message"
  ></div>


  <!-- ============================= -->
  <!-- 업로드 -->
  <!-- ============================= -->

  <div class="file-box">

    <input
      type="file"
      id="file"
    >

    <div
      id="selectedFile"
      class="selected-file"
    >
      선택된 파일 없음
    </div>

  </div>


  <button
    id="uploadButton"
    onclick="uploadFile()"
  >
    파일 업로드
  </button>


  <!-- ============================= -->
  <!-- 진행률 -->
  <!-- ============================= -->

  <div
    id="progressArea"
    class="progress-area"
  >

    <div class="progress-bar">

      <div
        id="progressFill"
        class="progress-fill"
      ></div>

    </div>

    <div
      id="progressText"
      class="progress-text"
    >
      준비 중...
    </div>

  </div>


  <!-- ============================= -->
  <!-- 일반 파일 목록 -->
  <!-- 삭제 버튼 없음 -->
  <!-- ============================= -->

  <div class="files">

    <h2>업로드된 파일</h2>

    <div id="fileList">
      불러오는 중...
    </div>

  </div>


  <!-- ============================= -->
  <!-- 관리자 버튼 -->
  <!-- ============================= -->

  <button
    class="admin-button"
    onclick="loginAdmin()"
  >
    관리자 모드
  </button>


  <!-- ============================= -->
  <!-- 관리자 패널 -->
  <!-- ============================= -->

  <div
    id="adminPanel"
    class="admin-panel"
  >

    <div class="admin-title">

      <h2>관리자 모드</h2>

      <button
        class="logout-button"
        onclick="logoutAdmin()"
      >
        로그아웃
      </button>

    </div>


    <div
      id="adminFileList"
      style="margin-top:20px;"
    >
      불러오는 중...
    </div>

  </div>

</div>


<script>

const API =
  "https://files.hjcone.workers.dev";


const fileInput =
  document.getElementById("file");

const selectedFile =
  document.getElementById(
    "selectedFile"
  );

const uploadButton =
  document.getElementById(
    "uploadButton"
  );

const progressArea =
  document.getElementById(
    "progressArea"
  );

const progressFill =
  document.getElementById(
    "progressFill"
  );

const progressText =
  document.getElementById(
    "progressText"
  );

const message =
  document.getElementById(
    "message"
  );

const fileList =
  document.getElementById(
    "fileList"
  );

const adminPanel =
  document.getElementById(
    "adminPanel"
  );

const adminFileList =
  document.getElementById(
    "adminFileList"
  );


// ====================================
// 파일 선택
// ====================================

fileInput.addEventListener(
  "change",
  function () {

    if (
      !fileInput.files ||
      fileInput.files.length === 0
    ) {

      selectedFile.textContent =
        "선택된 파일 없음";

      return;
    }

    const file =
      fileInput.files[0];

    selectedFile.textContent =
      `${file.name} (${formatBytes(file.size)})`;
  }
);


// ====================================
// 업로드
// ====================================

function uploadFile() {

  if (
    !fileInput.files ||
    fileInput.files.length === 0
  ) {

    showMessage(
      "파일을 먼저 선택해 주세요.",
      false
    );

    return;
  }


  const file =
    fileInput.files[0];


  const formData =
    new FormData();

  formData.append(
    "file",
    file
  );


  const xhr =
    new XMLHttpRequest();


  uploadButton.disabled =
    true;

  uploadButton.textContent =
    "업로드 중...";


  progressArea.style.display =
    "block";


  progressFill.style.width =
    "0%";


  const startTime =
    Date.now();


  xhr.upload.addEventListener(
    "progress",
    function (event) {

      if (!event.lengthComputable) {
        return;
      }


      const percent =
        event.loaded /
        event.total *
        100;


      const elapsed =
        (Date.now() -
          startTime) /
        1000;


      const speed =
        elapsed > 0
          ? event.loaded /
            elapsed
          : 0;


      progressFill.style.width =
        `${percent}%`;


      progressText.innerHTML =
        `${percent.toFixed(1)}%<br>` +
        `${formatBytes(event.loaded)} / ` +
        `${formatBytes(event.total)}<br>` +
        `속도: ${formatBytes(speed)}/초`;
    }
  );


  xhr.addEventListener(
    "load",
    function () {

      uploadButton.disabled =
        false;

      uploadButton.textContent =
        "파일 업로드";


      let data = null;


      try {
        data =
          JSON.parse(
            xhr.responseText
          );
      } catch {
        data = null;
      }


      if (
        xhr.status >= 200 &&
        xhr.status < 300 &&
        data?.success
      ) {

        progressFill.style.width =
          "100%";

        progressText.innerHTML =
          "100%<br>업로드 완료";


        showMessage(
          data.message ||
          "업로드가 완료되었습니다.",
          true
        );


        fileInput.value = "";

        selectedFile.textContent =
          "선택된 파일 없음";


        loadFiles();

        if (
          adminPanel.style.display ===
          "block"
        ) {
          loadAdminFiles();
        }

      } else {

        showMessage(
          data?.error ||
          `업로드 실패 (${xhr.status})`,
          false
        );
      }
    }
  );


  xhr.addEventListener(
    "error",
    function () {

      uploadButton.disabled =
        false;

      uploadButton.textContent =
        "파일 업로드";


      showMessage(
        "네트워크 오류가 발생했습니다.",
        false
      );
    }
  );


  xhr.open(
    "POST",
    `${API}/upload`,
    true
  );


  xhr.send(formData);
}


// ====================================
// 일반 사용자 파일 목록
// 삭제 없음
// ====================================

async function loadFiles() {

  fileList.textContent =
    "불러오는 중...";


  try {

    const response =
      await fetch(
        `${API}/files`,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "파일 목록을 불러오지 못했습니다."
      );
    }


    renderPublicFiles(
      data.files || []
    );

  } catch (error) {

    fileList.innerHTML =
      `<div class="empty">
        파일 목록을 불러오지 못했습니다.
      </div>`;
  }
}


// ====================================
// 일반 사용자 목록 표시
// ====================================

function renderPublicFiles(files) {

  if (!files.length) {

    fileList.innerHTML =
      `<div class="empty">
        업로드된 파일이 없습니다.
      </div>`;

    return;
  }


  fileList.innerHTML =
    "";


  files.forEach(
    function (file) {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "file-item";


      const info =
        document.createElement(
          "div"
        );

      info.className =
        "file-info";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "file-name";

      name.textContent =
        file.name;


      const size =
        document.createElement(
          "div"
        );

      size.className =
        "file-size";

      size.textContent =
        formatBytes(file.size);


      info.appendChild(name);

      info.appendChild(size);

      item.appendChild(info);

      fileList.appendChild(item);
    }
  );
}


// ====================================
// 관리자 로그인
// ====================================

async function loginAdmin() {

  const password =
    prompt(
      "관리자 비밀번호를 입력하세요."
    );


  if (!password) {
    return;
  }


  const response =
    await fetch(
      `${API}/admin/files`,
      {
        method: "GET",

        headers: {
          "X-Admin-Password":
            password
        },

        cache: "no-store"
      }
    );


  let data = null;


  try {
    data =
      await response.json();
  } catch {
    data = null;
  }


  if (
    !response.ok ||
    !data?.success
  ) {

    alert(
      "관리자 인증에 실패했습니다."
    );

    return;
  }


  sessionStorage.setItem(
    "adminPassword",
    password
  );


  adminPanel.style.display =
    "block";


  renderAdminFiles(
    data.files || []
  );
}


// ====================================
// 관리자 파일 목록
// ====================================

async function loadAdminFiles() {

  const password =
    sessionStorage.getItem(
      "adminPassword"
    );


  if (!password) {
    return;
  }


  adminFileList.textContent =
    "불러오는 중...";


  try {

    const response =
      await fetch(
        `${API}/admin/files`,
        {
          method: "GET",

          headers: {
            "X-Admin-Password":
              password
          },

          cache: "no-store"
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success
    ) {

      logoutAdmin();

      return;
    }


    renderAdminFiles(
      data.files || []
    );

  } catch {

    adminFileList.innerHTML =
      `<div class="empty">
        관리자 파일 목록을 불러오지 못했습니다.
      </div>`;
  }
}


// ====================================
// 관리자 파일 표시
// ====================================

function renderAdminFiles(files) {

  if (!files.length) {

    adminFileList.innerHTML =
      `<div class="empty">
        업로드된 파일이 없습니다.
      </div>`;

    return;
  }


  adminFileList.innerHTML =
    "";


  files.forEach(
    function (file) {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "admin-file-item";


      const info =
        document.createElement(
          "div"
        );

      info.className =
        "admin-file-info";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "admin-file-name";

      name.textContent =
        file.name;


      const size =
        document.createElement(
          "div"
        );

      size.className =
        "admin-file-size";

      size.textContent =
        formatBytes(file.size);


      info.appendChild(name);

      info.appendChild(size);


      const download =
        document.createElement(
          "button"
        );

      download.className =
        "admin-action download-button";

      download.textContent =
        "다운로드";


      download.onclick =
        function () {

          downloadFile(
            file.name
          );
        };


      const deleteButton =
        document.createElement(
          "button"
        );

      deleteButton.className =
        "admin-action delete-button";

      deleteButton.textContent =
        "삭제";


      deleteButton.onclick =
        function () {

          adminDeleteFile(
            file.name
          );
        };


      item.appendChild(info);

      item.appendChild(download);

      item.appendChild(deleteButton);


      adminFileList.appendChild(item);
    }
  );
}


// ====================================
// 관리자 다운로드
// ====================================

async function downloadFile(
  filename
) {

  const password =
    sessionStorage.getItem(
      "adminPassword"
    );


  if (!password) {
    return;
  }


  try {

    const response =
      await fetch(
        `${API}/admin/download?name=${encodeURIComponent(filename)}`,
        {
          method: "GET",

          headers: {
            "X-Admin-Password":
              password
          }
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "다운로드 정보를 가져오지 못했습니다."
      );
    }


    const link =
      document.createElement("a");


    link.href =
      data.download_url;


    link.download =
      filename;


    link.target =
      "_blank";


    document.body.appendChild(link);

    link.click();

    link.remove();

  } catch (error) {

    alert(
      error.message ||
      "다운로드에 실패했습니다."
    );
  }
}


// ====================================
// 관리자 삭제
// ====================================

async function adminDeleteFile(
  filename
) {

  const confirmed =
    confirm(
      `"${filename}" 파일을 정말 삭제하시겠습니까?\n\nGitHub 저장소에서도 삭제됩니다.`
    );


  if (!confirmed) {
    return;
  }


  const password =
    sessionStorage.getItem(
      "adminPassword"
    );


  if (!password) {
    return;
  }


  try {

    const response =
      await fetch(
        `${API}/admin/delete`,
        {
          method: "DELETE",

          headers: {
            "Content-Type":
              "application/json",

            "X-Admin-Password":
              password
          },

          body:
            JSON.stringify({
              name: filename
            })
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "삭제에 실패했습니다."
      );
    }


    showMessage(
      data.message ||
      "파일이 삭제되었습니다.",
      true
    );


    loadFiles();

    loadAdminFiles();

  } catch (error) {

    alert(
      error.message ||
      "삭제 중 오류가 발생했습니다."
    );
  }
}


// ====================================
// 관리자 로그아웃
// ====================================

function logoutAdmin() {

  sessionStorage.removeItem(
    "adminPassword"
  );


  adminPanel.style.display =
    "none";


  adminFileList.innerHTML =
    "";
}


// ====================================
// 메시지
// ====================================

function showMessage(
  text,
  success
) {

  message.textContent =
    text;


  message.className =
    success
      ? "message success"
      : "message error";
}


// ====================================
// 파일 크기
// ====================================

function formatBytes(bytes) {

  if (
    !bytes ||
    bytes === 0
  ) {
    return "0 B";
  }


  const units = [
    "B",
    "KB",
    "MB",
    "GB"
  ];


  const index =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );


  const size =
    bytes /
    Math.pow(
      1024,
      index
    );


  return (
    size.toFixed(2) +
    " " +
    units[index]
  );
}


// ====================================
// 페이지 시작
// ====================================

loadFiles();

</script>

</body>

</html>
