<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>파일 업로드</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 25px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #222;
      color: white;
      font-size: 14px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input[type="file"] {
      margin-bottom: 15px;
    }

    #progressBox {
      display: none;
      margin-top: 15px;
    }

    progress {
      width: 100%;
      height: 20px;
    }

    .file {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .file:last-child {
      border-bottom: none;
    }

    .fileName {
      word-break: break-all;
      flex: 1;
    }

    .fileActions {
      display: flex;
      gap: 6px;
    }

    .download {
      background: #2563eb;
    }

    .delete {
      background: #dc2626;
    }

    .admin {
      background: #555;
    }

    .logout {
      background: #777;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #e7f7ed;
      color: #166534;
    }

    .error {
      background: #fdecec;
      color: #991b1b;
    }

    #adminPanel {
      display: none;
    }

    .adminStatus {
      margin-bottom: 15px;
      font-weight: bold;
    }

    .speed {
      margin-top: 8px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>

  <h1>파일 업로드</h1>

  <!-- 업로드 -->
  <div class="box">

    <input type="file" id="fileInput">

    <br>

    <button id="uploadButton">
      업로드
    </button>

    <div id="progressBox">

      <progress
        id="progress"
        value="0"
        max="100">
      </progress>

      <div id="progressText">
        0%
      </div>

      <div
        id="speedText"
        class="speed">
        -
      </div>

    </div>

    <div
      id="uploadMessage"
      class="message">
    </div>

  </div>


  <!-- 공개 파일 목록 -->
  <div class="box">

    <h2>업로드된 파일</h2>

    <div id="publicFiles">
      불러오는 중...
    </div>

  </div>


  <!-- 관리자 -->
  <div class="box">

    <button
      id="adminButton"
      class="admin">
      관리자 모드
    </button>

    <div
      id="adminMessage"
      class="message">
    </div>

  </div>


  <!-- 관리자 패널 -->
  <div
    id="adminPanel"
    class="box">

    <div class="adminStatus">
      관리자 모드가 활성화되었습니다.
    </div>

    <button
      id="logoutButton"
      class="logout">
      관리자 로그아웃
    </button>

    <h2>관리자 파일 관리</h2>

    <div id="adminFiles">
      불러오는 중...
    </div>

  </div>


<script>

const API = "https://files.hjcone.workers.dev";


// ======================================
// 메시지 표시
// ======================================

function showMessage(element, message, type) {

  element.textContent = message;

  element.className =
    "message " + type;

  element.style.display = "block";
}


function hideMessage(element) {
  element.style.display = "none";
}


// ======================================
// 파일 크기 표시
// ======================================

function formatSize(bytes) {

  if (!bytes) {
    return "0 B";
  }

  const units = [
    "B",
    "KB",
    "MB",
    "GB",
    "TB"
  ];

  let size = bytes;
  let index = 0;

  while (
    size >= 1024 &&
    index < units.length - 1
  ) {
    size /= 1024;
    index++;
  }

  return size.toFixed(
    index === 0 ? 0 : 1
  ) + " " + units[index];
}


// ======================================
// 공개 파일 목록
// ======================================

async function loadPublicFiles() {

  const container =
    document.getElementById("publicFiles");

  try {

    const response =
      await fetch(`${API}/files`);

    const data =
      await response.json();

    if (!response.ok || !data.ok) {
      throw new Error(
        data.error || "파일 목록을 가져오지 못했습니다."
      );
    }

    container.innerHTML = "";

    if (!data.files.length) {

      container.textContent =
        "업로드된 파일이 없습니다.";

      return;
    }

    data.files.forEach(file => {

      const row =
        document.createElement("div");

      row.className = "file";

      const name =
        document.createElement("div");

      name.className = "fileName";

      name.textContent =
        `${file.name} (${formatSize(file.size)})`;

      row.appendChild(name);

      container.appendChild(row);
    });

  } catch (error) {

    container.textContent =
      "파일 목록을 불러오지 못했습니다: " +
      error.message;
  }
}


// ======================================
// 업로드
// ======================================

document
  .getElementById("uploadButton")
  .addEventListener("click", uploadFile);


function uploadFile() {

  const input =
    document.getElementById("fileInput");

  const file =
    input.files[0];

  const button =
    document.getElementById("uploadButton");

  const progressBox =
    document.getElementById("progressBox");

  const progress =
    document.getElementById("progress");

  const progressText =
    document.getElementById("progressText");

  const speedText =
    document.getElementById("speedText");

  const message =
    document.getElementById("uploadMessage");


  if (!file) {

    showMessage(
      message,
      "업로드할 파일을 선택해주세요.",
      "error"
    );

    return;
  }


  button.disabled = true;

  progressBox.style.display = "block";

  progress.value = 0;

  progressText.textContent = "0%";

  speedText.textContent = "-";

  hideMessage(message);


  const formData =
    new FormData();

  formData.append(
    "file",
    file
  );


  const xhr =
    new XMLHttpRequest();

  const startTime =
    Date.now();


  xhr.open(
    "POST",
    `${API}/upload`
  );


  xhr.upload.onprogress =
    function(event) {

      if (!event.lengthComputable) {
        return;
      }

      const percent =
        Math.round(
          event.loaded /
          event.total *
          100
        );

      progress.value =
        percent;

      progressText.textContent =
        `${percent}%`;


      const elapsed =
        (Date.now() - startTime) / 1000;

      if (elapsed > 0) {

        const speed =
          event.loaded /
          elapsed;

        speedText.textContent =
          `속도: ${formatSize(speed)}/s`;
      }
    };


  xhr.onload =
    async function() {

      button.disabled = false;

      try {

        const data =
          JSON.parse(xhr.responseText);

        if (
          xhr.status < 200 ||
          xhr.status >= 300 ||
          !data.ok
        ) {
          throw new Error(
            data.error ||
            "업로드에 실패했습니다."
          );
        }

        progress.value = 100;

        progressText.textContent =
          "100%";

        showMessage(
          message,
          `${data.name} 업로드 완료!`,
          "success"
        );

        input.value = "";

        await loadPublicFiles();

        if (
          sessionStorage.getItem(
            "adminPassword"
          )
        ) {
          await loadAdminFiles();
        }

      } catch (error) {

        showMessage(
          message,
          error.message,
          "error"
        );
      }
    };


  xhr.onerror =
    function() {

      button.disabled = false;

      showMessage(
        message,
        "서버와 통신하지 못했습니다.",
        "error"
      );
    };


  xhr.send(formData);
}


// ======================================
// 관리자 모드
// ======================================

document
  .getElementById("adminButton")
  .addEventListener(
    "click",
    adminLogin
  );


async function adminLogin() {

  const password =
    prompt(
      "관리자 비밀번호를 입력하세요."
    );


  if (password === null) {
    return;
  }


  if (!password) {

    showMessage(
      document.getElementById(
        "adminMessage"
      ),
      "비밀번호를 입력해주세요.",
      "error"
    );

    return;
  }


  const message =
    document.getElementById(
      "adminMessage"
    );

  hideMessage(message);


  try {

    const response =
      await fetch(
        `${API}/admin/files`,
        {
          method: "GET",

          headers: {
            "X-Admin-Password":
              password
          }
        }
      );


    const data =
      await response.json();


    if (!response.ok || !data.ok) {

      throw new Error(
        data.error ||
        "관리자 인증에 실패했습니다."
      );
    }


    // 인증 성공
    sessionStorage.setItem(
      "adminPassword",
      password
    );


    document
      .getElementById(
        "adminPanel"
      )
      .style.display = "block";


    showMessage(
      message,
      "관리자 인증 성공!",
      "success"
    );


    renderAdminFiles(
      data.files
    );

  } catch (error) {

    sessionStorage.removeItem(
      "adminPassword"
    );


    showMessage(
      message,
      "관리자 로그인 실패: " +
      error.message,
      "error"
    );

    console.error(
      "ADMIN LOGIN ERROR:",
      error
    );
  }
}


// ======================================
// 관리자 파일 목록
// ======================================

async function loadAdminFiles() {

  const password =
    sessionStorage.getItem(
      "adminPassword"
    );

  if (!password) {
    return;
  }


  try {

    const response =
      await fetch(
        `${API}/admin/files`,
        {
          headers: {
            "X-Admin-Password":
              password
          }
        }
      );


    const data =
      await response.json();


    if (!response.ok || !data.ok) {

      sessionStorage.removeItem(
        "adminPassword"
      );

      document
        .getElementById(
          "adminPanel"
        )
        .style.display = "none";

      throw new Error(
        data.error ||
        "관리자 인증이 만료되었습니다."
      );
    }


    renderAdminFiles(
      data.files
    );

  } catch (error) {

    console.error(
      "ADMIN FILE ERROR:",
      error
    );
  }
}


// ======================================
// 관리자 파일 표시
// ======================================

function renderAdminFiles(files) {

  const container =
    document.getElementById(
      "adminFiles"
    );


  container.innerHTML = "";


  if (!files.length) {

    container.textContent =
      "업로드된 파일이 없습니다.";

    return;
  }


  files.forEach(file => {

    const row =
      document.createElement("div");

    row.className = "file";


    const name =
      document.createElement("div");

    name.className =
      "fileName";

    name.textContent =
      `${file.name} (${formatSize(file.size)})`;


    const actions =
      document.createElement("div");

    actions.className =
      "fileActions";


    // 다운로드
    const download =
      document.createElement("button");

    download.textContent =
      "다운로드";

    download.className =
      "download";


    download.onclick =
      function() {

        downloadFile(
          file.name
        );
      };


    // 삭제
    const deleteButton =
      document.createElement("button");

    deleteButton.textContent =
      "삭제";

    deleteButton.className =
      "delete";


    deleteButton.onclick =
      function() {

        deleteFile(
          file.name
        );
      };


    actions.appendChild(
      download
    );

    actions.appendChild(
      deleteButton
    );


    row.appendChild(name);

    row.appendChild(actions);


    container.appendChild(row);
  });
}


// ======================================
// 관리자 다운로드
// ======================================

async function downloadFile(filename) {

  const password =
    sessionStorage.getItem(
      "adminPassword"
    );


  if (!password) {
    return;
  }


  try {

    const response =
      await fetch(
        `${API}/admin/download?name=${encodeURIComponent(filename)}`,
        {
          headers: {
            "X-Admin-Password":
              password
          }
        }
      );


    const data =
      await response.json();


    if (!response.ok || !data.ok) {

      throw new Error(
        data.error ||
        "다운로드 정보를 가져오지 못했습니다."
      );
    }


    window.open(
      data.download_url,
      "_blank"
    );

  } catch (error) {

    alert(
      "다운로드 실패: " +
      error.message
    );
  }
}


// ======================================
// 관리자 삭제
// ======================================

async function deleteFile(filename) {

  const password =
    sessionStorage.getItem(
      "adminPassword"
    );


  if (!password) {
    return;
  }


  const confirmed =
    confirm(
      `"${filename}" 파일을 삭제하시겠습니까?`
    );


  if (!confirmed) {
    return;
  }


  try {

    const response =
      await fetch(
        `${API}/admin/delete?name=${encodeURIComponent(filename)}`,
        {
          method: "DELETE",

          headers: {
            "X-Admin-Password":
              password
          }
        }
      );


    const data =
      await response.json();


    if (!response.ok || !data.ok) {

      throw new Error(
        data.error ||
        "파일 삭제에 실패했습니다."
      );
    }


    alert(
      `"${filename}" 파일이 삭제되었습니다.`
    );


    await loadPublicFiles();

    await loadAdminFiles();


  } catch (error) {

    alert(
      "삭제 실패: " +
      error.message
    );
  }
}


// ======================================
// 로그아웃
// ======================================

document
  .getElementById("logoutButton")
  .addEventListener(
    "click",
    function() {

      sessionStorage.removeItem(
        "adminPassword"
      );


      document
        .getElementById(
          "adminPanel"
        )
        .style.display = "none";


      showMessage(
        document.getElementById(
          "adminMessage"
        ),
        "관리자 모드에서 로그아웃했습니다.",
        "success"
      );
    }
  );


// ======================================
// 페이지 시작
// ======================================

loadPublicFiles();

</script>

</body>
</html>
