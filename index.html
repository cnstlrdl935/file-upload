<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>파일 업로드</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f6f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .upload-box {
      background: white;
      border: 2px dashed #999;
      border-radius: 16px;
      padding: 50px 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .upload-box:hover {
      border-color: #333;
    }

    .upload-box.dragover {
      border-color: #007bff;
      background: #eef6ff;
    }

    .upload-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .upload-text {
      font-size: 18px;
      font-weight: bold;
    }

    .upload-subtext {
      margin-top: 8px;
      color: #777;
      font-size: 14px;
    }

    #fileInput {
      display: none;
    }

    .selected-files {
      margin-top: 20px;
    }

    .file-item {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .file-name {
      font-weight: bold;
      word-break: break-all;
    }

    .file-size {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    .progress-container {
      margin-top: 10px;
      background: #e5e5e5;
      border-radius: 10px;
      height: 10px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #007bff;
      transition: width 0.2s;
    }

    .status {
      margin-top: 7px;
      font-size: 13px;
    }

    .button-area {
      text-align: center;
      margin-top: 20px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 25px;
      font-size: 16px;
      cursor: pointer;
      background: #007bff;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .uploaded-section {
      margin-top: 40px;
    }

    .uploaded-section h2 {
      margin-bottom: 15px;
    }

    .uploaded-item {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 10px;
    }

    .uploaded-item a {
      color: #007bff;
      text-decoration: none;
      word-break: break-all;
    }

    .empty {
      background: white;
      padding: 25px;
      text-align: center;
      border-radius: 12px;
      color: #777;
    }

    .error {
      color: #d00;
    }

    .success {
      color: #087f23;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>파일 업로드</h1>

  <div
    class="upload-box"
    id="uploadBox"
  >
    <div class="upload-icon">📁</div>

    <div class="upload-text">
      파일을 선택하거나 여기로 끌어다 놓으세요
    </div>

    <div class="upload-subtext">
      여러 파일을 동시에 선택할 수 있습니다.
    </div>

    <input
      type="file"
      id="fileInput"
      multiple
    >
  </div>


  <div
    class="selected-files"
    id="selectedFiles"
  ></div>


  <div class="button-area">
    <button
      id="uploadButton"
      disabled
    >
      업로드
    </button>
  </div>


  <div class="uploaded-section">

    <h2>업로드된 파일</h2>

    <div id="uploadedFiles">
      <div class="empty">
        업로드된 파일을 불러오는 중...
      </div>
    </div>

  </div>

</div>


<script>

  // Cloudflare Worker 주소
  const API =
    "https://files.hjcone.worker.dev";


  const uploadBox =
    document.getElementById("uploadBox");

  const fileInput =
    document.getElementById("fileInput");

  const selectedFiles =
    document.getElementById("selectedFiles");

  const uploadButton =
    document.getElementById("uploadButton");

  const uploadedFiles =
    document.getElementById("uploadedFiles");


  let filesToUpload = [];


  // 파일 선택창 열기
  uploadBox.addEventListener("click", () => {
    fileInput.click();
  });


  // 파일 선택
  fileInput.addEventListener("change", () => {

    addFiles(
      Array.from(fileInput.files)
    );

  });


  // 드래그 시작
  uploadBox.addEventListener("dragover", (event) => {

    event.preventDefault();

    uploadBox.classList.add("dragover");

  });


  // 드래그 종료
  uploadBox.addEventListener("dragleave", () => {

    uploadBox.classList.remove("dragover");

  });


  // 파일 놓기
  uploadBox.addEventListener("drop", (event) => {

    event.preventDefault();

    uploadBox.classList.remove("dragover");

    const files =
      Array.from(event.dataTransfer.files);

    addFiles(files);

  });


  // 파일 추가
  function addFiles(files) {

    filesToUpload =
      filesToUpload.concat(files);

    renderSelectedFiles();

    uploadButton.disabled =
      filesToUpload.length === 0;

  }


  // 선택된 파일 표시
  function renderSelectedFiles() {

    selectedFiles.innerHTML = "";

    filesToUpload.forEach((file, index) => {

      const item =
        document.createElement("div");

      item.className = "file-item";

      item.innerHTML = `

        <div class="file-name">
          ${escapeHtml(file.name)}
        </div>

        <div class="file-size">
          ${formatBytes(file.size)}
        </div>

        <div class="progress-container">

          <div
            class="progress-bar"
            id="progress-${index}"
          ></div>

        </div>

        <div
          class="status"
          id="status-${index}"
        >
          대기 중
        </div>

      `;

      selectedFiles.appendChild(item);

    });

  }


  // 업로드 시작
  uploadButton.addEventListener("click", async () => {

    if (filesToUpload.length === 0) {
      return;
    }

    uploadButton.disabled = true;

    for (
      let i = 0;
      i < filesToUpload.length;
      i++
    ) {

      await uploadFile(
        filesToUpload[i],
        i
      );

    }

    filesToUpload = [];

    fileInput.value = "";

    uploadButton.disabled = true;

    await loadUploadedFiles();

  });


  // 파일 하나 업로드
  async function uploadFile(file, index) {

    const progress =
      document.getElementById(
        `progress-${index}`
      );

    const status =
      document.getElementById(
        `status-${index}`
      );


    status.textContent =
      "파일 읽는 중...";


    try {

      const base64 =
        await fileToBase64(file);


      progress.style.width =
        "50%";


      status.textContent =
        "서버에 업로드 중...";


      const response =
        await fetch(
          API + "/upload",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              fileName:
                file.name,

              fileData:
                base64.split(",")[1]

            })

          }
        );


      const result =
        await response.json();


      if (!response.ok ||
          !result.success) {

        throw new Error(
          result.error ||
          "업로드 실패"
        );

      }


      progress.style.width =
        "100%";


      status.textContent =
        "업로드 완료";

      status.className =
        "status success";


    } catch (error) {

      status.textContent =
        "업로드 실패: " +
        error.message;

      status.className =
        "status error";

    }

  }


  // 파일 → Base64
  function fileToBase64(file) {

    return new Promise(
      (resolve, reject) => {

        const reader =
          new FileReader();


        reader.onload = () => {

          resolve(
            reader.result
          );

        };


        reader.onerror = () => {

          reject(
            new Error(
              "파일을 읽을 수 없습니다."
            )
          );

        };


        reader.readAsDataURL(file);

      }
    );

  }


  // 업로드 목록
  async function loadUploadedFiles() {

    uploadedFiles.innerHTML = `
      <div class="empty">
        업로드 목록을 준비 중입니다.
      </div>
    `;

    /*
      현재 Worker에는 /files API가 없습니다.
      GitHub API를 브라우저에서 직접 호출하지 않기 위해
      일단 업로드 기능부터 연결합니다.
    */

    uploadedFiles.innerHTML = `
      <div class="empty">
        파일을 업로드하면 GitHub 저장소의
        uploads 폴더에 저장됩니다.
      </div>
    `;

  }


  // HTML 특수문자 처리
  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }


  // 파일 크기 표시
  function formatBytes(bytes) {

    if (bytes === 0) {
      return "0 B";
    }

    const units = [
      "B",
      "KB",
      "MB",
      "GB",
      "TB"
    ];

    const i =
      Math.floor(
        Math.log(bytes) /
        Math.log(1024)
      );

    return (
      parseFloat(
        (bytes /
          Math.pow(1024, i))
          .toFixed(2)
      ) +
      " " +
      units[i]
    );

  }


  // 처음 실행
  loadUploadedFiles();

</script>

</body>
</html>
