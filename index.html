<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Worker 연결 테스트</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.99);
    }

    pre {
      margin-top: 20px;
      padding: 16px;
      background: #f0f0f0;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 100px;
    }

    .info {
      margin-top: 20px;
      padding: 15px;
      background: #eef6ff;
      border-radius: 8px;
      line-height: 1.6;
      word-break: break-word;
    }

    iframe {
      width: 100%;
      height: 100px;
      margin-top: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Cloudflare Worker 연결 테스트</h1>

    <div class="info">
      <strong>현재 페이지</strong><br>
      <span id="pageUrl"></span>
      <br><br>

      <strong>현재 Origin</strong><br>
      <span id="origin"></span>
      <br><br>

      <strong>Worker 주소</strong><br>
      <span id="workerUrl"></span>
    </div>

    <button onclick="testNormalFetch()">
      1. 일반 Fetch 테스트
    </button>

    <button onclick="testNoCors()">
      2. no-cors Fetch 테스트
    </button>

    <button onclick="testIframe()">
      3. 브라우저 직접 연결 테스트
    </button>

    <pre id="result">아직 테스트하지 않았습니다.</pre>

    <iframe
      id="testFrame"
      style="display:none;"
    ></iframe>

  </div>

<script>

const API = "https://files.hjcone.worker.dev";

const result = document.getElementById("result");
const pageUrl = document.getElementById("pageUrl");
const origin = document.getElementById("origin");
const workerUrl = document.getElementById("workerUrl");

pageUrl.textContent = window.location.href;
origin.textContent = window.location.origin;
workerUrl.textContent = API;


/*
========================================
1. 일반 Fetch 테스트
========================================
*/

async function testNormalFetch() {

  result.textContent =
    "1. 일반 Fetch 테스트 중...\n\n" +
    API + "/ping";

  try {

    const response = await fetch(
      API + "/ping?test=" + Date.now(),
      {
        method: "GET",
        cache: "no-store"
      }
    );

    const text = await response.text();

    result.textContent =
      "1. 일반 Fetch 테스트 성공\n\n" +
      "status: " + response.status + "\n" +
      "type: " + response.type + "\n" +
      "url: " + response.url + "\n\n" +
      "응답 내용:\n" +
      text;

  } catch (error) {

    result.textContent =
      "1. 일반 Fetch 테스트 실패\n\n" +
      "오류 이름: " + error.name + "\n" +
      "오류 메시지: " + error.message + "\n\n" +
      "요청 주소:\n" +
      API + "/ping";

  }

}


/*
========================================
2. no-cors 테스트
========================================
*/

async function testNoCors() {

  result.textContent =
    "2. no-cors Fetch 테스트 중...\n\n" +
    "잠시 기다려 주세요.";

  try {

    const response = await fetch(
      API + "/ping?nocors=" + Date.now(),
      {
        method: "GET",
        mode: "no-cors",
        cache: "no-store"
      }
    );

    result.textContent =
      "2. no-cors Fetch 테스트 성공\n\n" +
      "response.type: " + response.type + "\n" +
      "response.status: " + response.status + "\n\n" +
      "이 결과가 나오면 브라우저에서\n" +
      "Cloudflare Worker까지 연결된 것입니다.\n\n" +
      "no-cors에서는 보안상 응답 내용을 읽을 수 없으므로\n" +
      "type이 opaque로 나오는 것이 정상입니다.";

  } catch (error) {

    result.textContent =
      "2. no-cors Fetch 테스트 실패\n\n" +
      "오류 이름: " + error.name + "\n" +
      "오류 메시지: " + error.message + "\n\n" +
      "이 경우 CORS 이전의 네트워크 연결 문제일\n" +
      "가능성이 있습니다.";

  }

}


/*
========================================
3. iframe 테스트
========================================
*/

function testIframe() {

  result.textContent =
    "3. 브라우저 직접 연결 테스트 중...\n\n" +
    "잠시 기다려 주세요.";

  const frame = document.getElementById("testFrame");

  frame.style.display = "block";

  frame.onload = function() {

    result.textContent =
      "3. 브라우저 직접 연결 테스트 성공\n\n" +
      "Cloudflare Worker의 /ping 페이지가\n" +
      "브라우저에서 로드되었습니다.\n\n" +
      "Worker 주소:\n" +
      API + "/ping";

  };

  frame.onerror = function() {

    result.textContent =
      "3. 브라우저 직접 연결 테스트 실패\n\n" +
      "Worker 페이지를 로드하지 못했습니다.";

  };

  frame.src =
    API + "/ping?iframe=" + Date.now();

}

</script>

</body>
</html>
