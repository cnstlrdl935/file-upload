<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>파일 업로드</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans KR",
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f7f9fc 0%,
          #eef2f7 100%
        );

      color: #1f2937;
    }

    .container {
      width: min(680px, calc(100% - 32px));
      margin: 0 auto;
      padding: 70px 0 50px;
    }

    /* =========================
       헤더
    ========================= */

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background: #111827;
      color: white;

      font-size: 25px;
      font-weight: 700;

      box-shadow:
        0 10px 25px rgba(17, 24, 39, 0.18);
    }

    h1 {
      margin: 0 0 8px;

      font-size: 30px;
      font-weight: 750;
      letter-spacing: -0.8px;

      color: #111827;
    }

    .subtitle {
      margin: 0;

      color: #6b7280;
      font-size: 15px;
    }

    /* =========================
       카드
    ========================= */

    .card {
      background: rgba(255, 255, 255, 0.94);

      border: 1px solid rgba(229, 231, 235, 0.9);

      border-radius: 22px;

      padding: 28px;

      box-shadow:
        0 12px 35px rgba(15, 23, 42, 0.07);

      backdrop-filter: blur(10px);
    }

    /* =========================
       파일 선택 영역
    ========================= */

    .drop-area {
      border: 2px dashed #d1d5db;

      border-radius: 18px;

      padding: 35px 20px;

      text-align: center;

      transition: 0.2s ease;

      cursor: pointer;

      background: #fafafa;
    }

    .drop-area:hover {
      border-color: #9ca3af;
      background: #f8fafc;
    }

    .upload-icon {
      font-size: 34px;
      margin-bottom: 12px;
    }

    .drop-title {
      font-size: 16px;
      font-weight: 650;

      color: #374151;

      margin-bottom: 6px;
    }

    .drop-description {
      font-size: 13px;
      color: #9ca3af;
    }

    #fileInput {
      display: none;
    }

    .selected-file {
      display: none;

      margin-top: 16px;
      padding: 13px 15px;

      background: #f3f4f6;

      border-radius: 12px;

      font-size: 14px;

      word-break: break-all;
    }

    /* =========================
       버튼
    ========================= */

    .button {
      width: 100%;

      margin-top: 18px;

      padding: 14px 18px;

      border: none;
      border-radius: 13px;

      background: #111827;
      color: white;

      font-size: 15px;
      font-weight: 650;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;
    }

    .button:hover {
      background: #1f2937;

      transform: translateY(-1px);

      box-shadow:
        0 7px 18px rgba(17, 24, 39, 0.16);
    }

    .button:active {
      transform: translateY(0);
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* =========================
       진행률
    ========================= */

    #progressBox {
      display: none;

      margin-top: 22px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;

      margin-bottom: 8px;

      font-size: 13px;
      color: #6b7280;
    }

    progress {
      width: 100%;
      height: 9px;

      border: none;

      appearance: none;
      -webkit-appearance: none;
    }

    progress::-webkit-progress-bar {
      background: #e5e7eb;
      border-radius: 999px;
    }

    progress::-webkit-progress-value {
      background: #111827;
      border-radius: 999px;
    }

    progress::-moz-progress-bar {
      background: #111827;
      border-radius: 999px;
    }

    .speed {
      margin-top: 8px;

      text-align: right;

      font-size: 12px;
      color: #9ca3af;
    }

    /* =========================
       메시지
    ========================= */

    .message {
      display: none;

      margin-top: 15px;

      padding: 13px 15px;

      border-radius: 12px;

      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    .error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    /* =========================
       관리자
    ========================= */

    .admin-section {
      margin-top: 18px;

      text-align: center;
    }

    .admin-button {
      border: none;

      background: transparent;

      color: #9ca3af;

      font-size: 12px;

      cursor: pointer;

      padding: 8px 12px;

      border-radius: 8px;
    }

    .admin-button:hover {
      background: #f3f4f6;
      color: #4b5563;
    }

    /* =========================
       관리자 패널
    ========================= */

    #adminPanel {
      display: none;

      margin-top: 18px;
    }

    .admin-header {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 15px;

      margin-bottom: 20px;
    }

    .admin-title {
      margin: 0;

      font-size: 18px;
      font-weight: 700;

      color: #111827;
    }

    .admin-badge {
      display: inline-block;

      margin-top: 5px;

      padding: 4px 8px;

      border-radius: 999px;

      background: #ecfdf5;
      color: #047857;

      font-size: 11px;
      font-weight: 600;
    }

    .logout-button {
      border: none;

      background: #f3f4f6;
      color: #4b5563;

      padding: 8px 12px;

      border-radius: 9px;

      cursor: pointer;

      font-size: 12px;
    }

    .logout-button:hover {
      background: #e5e7eb;
    }

    .admin-file {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 15px;

      padding: 14px 0;

      border-bottom: 1px solid #f0f0f0;
    }

    .admin-file:last-child {
      border-bottom: none;
    }

    .admin-file-name {
      flex: 1;

      min-width: 0;

      font-size: 14px;

      word-break: break-all;
    }

    .admin-file-size {
      margin-top: 3px;

      color: #9ca3af;

      font-size: 12px;
    }

    .admin-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .small-button {
      border: none;

      padding: 8px 11px;

      border-radius: 8px;

      color: white;

      cursor: pointer;

      font-size: 12px;
    }

    .download {
      background: #2563eb;
    }

    .download:hover {
      background: #1d4ed8;
    }

    .delete {
      background: #ef4444;
    }

    .delete:hover {
      background: #dc2626;
    }

    .empty {
      padding: 30px 10px;

      text-align: center;

      color: #9ca3af;

      font-size: 14px;
    }

    /* =========================
       모바일
    ========================= */

    @media (max-width: 600px) {

      .container {
        width: calc(100% - 22px);

        padding-top: 40px;
      }

      .card {
        padding: 20px;

        border-radius: 18px;
      }

      h1 {
        font-size: 26px;
      }

      .drop-area {
        padding: 28px 15px;
      }

      .admin-file {
        align-items: flex-start;
        flex-direction: column;
      }

      .admin-actions {
        width: 100%;
      }

      .small-button {
        flex: 1;
      }

      .admin-header {
        align-items: flex-start;
      }
    }

  </style>
</head>


<body>

<div class="container">

  <!-- 헤더 -->
  <div class="header">

    <div class="logo">
      ↑
    </div>

    <h1>
      파일 업로드
    </h1>

    <p class="subtitle">
      파일을 선택해서 안전하게 업로드하세요.
    </p>

  </div>


  <!-- 업로드 카드 -->
  <div class="card">

    <label
      class="drop-area"
      for="fileInput">

      <div class="upload-icon">
        ↑
      </div>

      <div class="drop-title">
        파일을 선택하세요
      </div>

      <div class="drop-description">
        클릭해서 업로드할 파일을 선택할 수 있습니다.
      </div>

    </label>


    <input
      type="file"
      id="fileInput"
    >


    <div
      id="selectedFile"
      class="selected-file">
    </div>


    <button
      id="uploadButton"
      class="button">

      업로드

    </button>


    <!-- 진행률 -->
    <div id="progressBox">

      <div class="progress-header">

        <span>
          업로드 중
        </span>

        <span id="progressText">
          0%
        </span>

      </div>


      <progress
        id="progress"
        value="0"
        max="100">
      </progress>


      <div
        id="speedText"
        class="speed">

        -

      </div>

    </div>


    <!-- 업로드 메시지 -->
    <div
      id="uploadMessage"
      class="message">
    </div>

  </div>


  <!-- 관리자 -->
  <div class="admin-section">

    <button
      id="adminButton"
      class="admin-button">

      관리자 모드

    </button>

  </div>


  <div
    id="adminMessage"
    class="message">
  </div>


  <!-- 관리자 패널 -->
  <div
    id="adminPanel"
    class="card">

    <div class="admin-header">

      <div>

        <div class="admin-title">
          관리자 파일 관리
        </div>

        <div class="admin-badge">
          관리자 인증됨
        </div>

      </div>


      <button
        id="logoutButton"
        class="logout-button">

        로그아웃

      </button>

    </div>


    <div id="adminFiles">

      불러오는 중...

    </div>

  </div>

</div>


<script>

const API =
  "https://files.hjcone.workers.dev";


// ======================================
// 메시지
// ======================================

function showMessage(
  element,
  message,
  type
) {

  element.textContent =
    message;

  element.className =
    "message " + type;

  element.style.display =
    "block";
}


function hideMessage(element) {

  element.style.display =
    "none";
}


// ======================================
// 파일 크기
// ======================================

function formatSize(bytes) {

  if (!bytes) {
    return "0 B";
  }

  const units = [
    "B",
    "KB",
    "MB",
    "GB",
    "TB"
  ];

  let size = bytes;
  let index = 0;

  while (
    size >= 1024 &&
    index < units.length - 1
  ) {

    size /= 1024;
    index++;
  }

  return (
    size.toFixed(
      index === 0 ? 0 : 1
    )
    + " "
    + units[index]
  );
}


// ======================================
// 파일 선택
// ======================================

const fileInput =
  document.getElementById(
    "fileInput"
  );


fileInput.addEventListener(
  "change",
  function() {

    const file =
      fileInput.files[0];

    const selected =
      document.getElementById(
        "selectedFile"
      );


    if (!file) {

      selected.style.display =
        "none";

      return;
    }


    selected.textContent =
      `선택된 파일: ${file.name} (${formatSize(file.size)})`;

    selected.style.display =
      "block";
  }
);


// ======================================
// 업로드
// ======================================

document
  .getElementById("uploadButton")
  .addEventListener(
    "click",
    uploadFile
  );


function uploadFile() {

  const file =
    fileInput.files[0];

  const button =
    document.getElementById(
      "uploadButton"
    );

  const progressBox =
    document.getElementById(
      "progressBox"
    );

  const progress =
    document.getElementById(
      "progress"
    );

  const progressText =
    document.getElementById(
      "progressText"
    );

  const speedText =
    document.getElementById(
      "speedText"
    );

  const message =
    document.getElementById(
      "uploadMessage"
    );


  if (!file) {

    showMessage(
      message,
      "먼저 업로드할 파일을 선택해주세요.",
      "error"
    );

    return;
  }


  button.disabled =
    true;

  button.textContent =
    "업로드 중...";


  progressBox.style.display =
    "block";

  progress.value =
    0;

  progressText.textContent =
    "0%";

  speedText.textContent =
    "-";

  hideMessage(message);


  const formData =
    new FormData();

  formData.append(
    "file",
    file
  );


  const xhr =
    new XMLHttpRequest();

  const startTime =
    Date.now();


  xhr.open(
    "POST",
    `${API}/upload`
  );


  xhr.upload.onprogress =
    function(event) {

      if (!event.lengthComputable) {
        return;
      }


      const percent =
        Math.round(
          event.loaded /
          event.total *
          100
        );


      progress.value =
        percent;

      progressText.textContent =
        `${percent}%`;


      const elapsed =
        (Date.now() - startTime) /
        1000;


      if (elapsed > 0) {

        const speed =
          event.loaded /
          elapsed;


        speedText.textContent =
          `속도 ${formatSize(speed)}/s`;
      }
    };


  xhr.onload =
    function() {

      button.disabled =
        false;

      button.textContent =
        "업로드";


      try {

        const data =
          JSON.parse(
            xhr.responseText
          );


        if (
          xhr.status < 200 ||
          xhr.status >= 300 ||
          !data.ok
        ) {

          throw new Error(
            data.error ||
            "업로드에 실패했습니다."
          );
        }


        progress.value =
          100;

        progressText.textContent =
          "100%";


        showMessage(
          message,
          `${data.name} 업로드가 완료되었습니다.`,
          "success"
        );


        fileInput.value = "";


        document
          .getElementById(
            "selectedFile"
          )
          .style.display =
          "none";


        // 관리자 로그인 상태라면
        // 관리자 목록만 갱신
        if (
          sessionStorage.getItem(
            "adminPassword"
          )
        ) {

          loadAdminFiles();
        }


      } catch (error) {

        showMessage(
          message,
          error.message,
          "error"
        );
      }
    };


  xhr.onerror =
    function() {

      button.disabled =
        false;

      button.textContent =
        "업로드";


      showMessage(
        message,
        "서버와 통신하지 못했습니다.",
        "error"
      );
    };


  xhr.send(
    formData
  );
}


// ======================================
// 관리자 로그인
// ======================================

document
  .getElementById("adminButton")
  .addEventListener(
    "click",
    adminLogin
  );


async function adminLogin() {

  const password =
    prompt(
      "관리자 비밀번호를 입력하세요."
    );


  if (password === null) {
    return;
  }


  if (!password) {

    showMessage(
      document.getElementById(
        "adminMessage"
      ),
      "비밀번호를 입력해주세요.",
      "error"
    );

    return;
  }


  const message =
    document.getElementById(
      "adminMessage"
    );


  hideMessage(message);


  try {

    const response =
      await fetch(
        `${API}/admin/files`,
        {
          method: "GET",

          headers: {
            "X-Admin-Password":
              password
          }
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.error ||
        "관리자 인증에 실패했습니다."
      );
    }


    sessionStorage.setItem(
      "adminPassword",
      password
    );


    document
      .getElementById(
        "adminPanel"
      )
      .style.display =
      "block";


    showMessage(
      message,
      "관리자 인증이 완료되었습니다.",
      "success"
    );


    renderAdminFiles(
      data.files
    );


  } catch (error) {

    sessionStorage.removeItem(
      "adminPassword"
    );


    showMessage(
      message,
      "관리자 로그인 실패: " +
      error.message,
      "error"
    );


    console.error(
      error
    );
  }
}


// ======================================
// 관리자 파일 목록
// ======================================

async function loadAdminFiles() {

  const password =
    sessionStorage.getItem(
      "adminPassword"
    );


  if (!password) {
    return;
  }


  try {

    const response =
      await fetch(
        `${API}/admin/files`,
        {
          headers: {
            "X-Admin-Password":
              password
          }
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok
    ) {

      sessionStorage.removeItem(
        "adminPassword"
      );


      document
        .getElementById(
          "adminPanel"
        )
        .style.display =
        "none";


      throw new Error(
        data.error ||
        "관리자 인증이 만료되었습니다."
      );
    }


    renderAdminFiles(
      data.files
    );


  } catch (error) {

    console.error(
      error
    );
  }
}


// ======================================
// 관리자 파일 표시
// ======================================

function renderAdminFiles(
  files
) {

  const container =
    document.getElementById(
      "adminFiles"
    );


  container.innerHTML =
    "";


  if (!files.length) {

    container.innerHTML =
      `
        <div class="empty">
          업로드된 파일이 없습니다.
        </div>
      `;

    return;
  }


  files.forEach(
    function(file) {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "admin-file";


      const info =
        document.createElement(
          "div"
        );


      info.style.flex =
        "1";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "admin-file-name";

      name.textContent =
        file.name;


      const size =
        document.createElement(
          "div"
        );

      size.className =
        "admin-file-size";

      size.textContent =
        formatSize(
          file.size
        );


      info.appendChild(
        name
      );

      info.appendChild(
        size
      );


      const actions =
        document.createElement(
          "div"
        );

      actions.className =
        "admin-actions";


      const download =
        document.createElement(
          "button"
        );

      download.className =
        "small-button download";

      download.textContent =
        "다운로드";


      download.onclick =
        function() {

          downloadFile(
            file.name
          );
        };


      const deleteButton =
        document.createElement(
          "button"
        );

      deleteButton.className =
        "small-button delete";

      deleteButton.textContent =
        "삭제";


      deleteButton.onclick =
        function() {

          deleteFile(
            file.name
          );
        };


      actions.appendChild(
        download
      );

      actions.appendChild(
        deleteButton
      );


      row.appendChild(
        info
      );

      row.appendChild(
        actions
      );


      container.appendChild(
        row
      );
    }
  );
}


// ======================================
// 다운로드
// ======================================

async function downloadFile(
  filename
) {

  const password =
    sessionStorage.getItem(
      "adminPassword"
    );


  if (!password) {
    return;
  }


  try {

    const response =
      await fetch(
        `${API}/admin/download?name=${encodeURIComponent(filename)}`,
        {
          headers: {
            "X-Admin-Password":
              password
          }
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.error ||
        "다운로드에 실패했습니다."
      );
    }


    window.open(
      data.download_url,
      "_blank"
    );


  } catch (error) {

    alert(
      "다운로드 실패: " +
      error.message
    );
  }
}


// ======================================
// 삭제
// ======================================

async function deleteFile(
  filename
) {

  const password =
    sessionStorage.getItem(
      "adminPassword"
    );


  if (!password) {
    return;
  }


  const confirmed =
    confirm(
      `"${filename}" 파일을 삭제하시겠습니까?`
    );


  if (!confirmed) {
    return;
  }


  try {

    const response =
      await fetch(
        `${API}/admin/delete?name=${encodeURIComponent(filename)}`,
        {
          method: "DELETE",

          headers: {
            "X-Admin-Password":
              password
          }
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.error ||
        "삭제에 실패했습니다."
      );
    }


    await loadAdminFiles();


  } catch (error) {

    alert(
      "삭제 실패: " +
      error.message
    );
  }
}


// ======================================
// 로그아웃
// ======================================

document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    function() {

      sessionStorage.removeItem(
        "adminPassword"
      );


      document

          "adminPanel"
        )

      showMessage(
