<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>파일 업로드</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      width: min(700px, calc(100% - 32px));
      margin: 40px auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 10px;
    }

    .description {
      color: #666;
      margin-bottom: 25px;
    }

    .drop-zone {
      border: 2px dashed #aaa;
      border-radius: 14px;
      padding: 45px 20px;
      text-align: center;
      cursor: pointer;
      background: #fafafa;
    }

    .drop-zone:hover {
      background: #f0f0f0;
    }

    .drop-zone strong {
      display: block;
      margin-bottom: 8px;
      font-size: 18px;
    }

    .drop-zone span {
      color: #777;
      font-size: 14px;
    }

    #fileInput {
      display: none;
    }

    .server-status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f1f1f1;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #d32f2f;
    }

    .file-list {
      margin-top: 25px;
    }

    .file-item {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .file-name {
      font-weight: bold;
      word-break: break-all;
    }

    .file-size {
      color: #777;
      font-size: 13px;
      margin: 5px 0 10px;
    }

    .progress-container {
      height: 8px;
      background: #e5e5e5;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: #333;
      transition: width 0.2s;
    }

    .status {
      margin-top: 8px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    #uploadButton {
      background: #222;
      color: white;
    }

    #uploadButton:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #clearButton {
      background: white;
      border: 1px solid #ccc;
    }

    .debug {
      margin-top: 20px;
      padding: 15px;
      background: #fff7e6;
      border: 1px solid #ffd591;
      border-radius: 10px;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>파일 업로드</h1>

    <p class="description">
      파일을 선택하거나 이곳에 끌어다 놓으세요.
    </p>

    <div class="drop-zone" id="dropZone">
      <strong>파일 선택</strong>
      <span>클릭하거나 파일을 드래그하세요.</span>
    </div>

    <input
      type="file"
      id="fileInput"
      multiple
    >

    <div
      id="serverStatus"
      class="server-status"
    >
      서버 연결 확인 중...
    </div>

    <div
      id="debug"
      class="debug"
    >
      진단 정보 준비 중...
    </div>

    <div
      id="fileList"
      class="file-list"
    ></div>

    <button
      id="uploadButton"
      disabled
    >
      파일 업로드
    </button>

    <button id="clearButton">
      선택한 파일 모두 지우기
    </button>

  </div>

</div>


<script>

const API = "https://files.hjcone.worker.dev";

const fileInput =
  document.getElementById("fileInput");

const dropZone =
  document.getElementById("dropZone");

const serverStatus =
  document.getElementById("serverStatus");

const debug =
  document.getElementById("debug");

const fileList =
  document.getElementById("fileList");

const uploadButton =
  document.getElementById("uploadButton");

const clearButton =
  document.getElementById("clearButton");


let selectedFiles = [];


/*
 * 진단 정보
 */
function showDebug(text) {
  debug.textContent = text;
}


/*
 * 서버 연결 테스트
 */
async function checkServer() {

  serverStatus.className =
    "server-status";

  serverStatus.textContent =
    "서버 연결 확인 중...";

  showDebug(
    "요청 주소:\n" +
    API + "/\n\n" +
    "브라우저에서 Cloudflare Worker에 GET 요청을 보내는 중..."
  );


  try {

    const response = await fetch(
      API + "/",
      {
        method: "GET",
        cache: "no-store"
      }
    );


    const text =
      await response.text();


    if (!response.ok) {

      throw new Error(
        "HTTP 상태 코드: " +
        response.status +
        "\n\n응답:\n" +
        text
      );

    }


    serverStatus.className =
      "server-status success";

    serverStatus.textContent =
      "서버 연결 정상";


    showDebug(
      "연결 성공\n\n" +
      "HTTP 상태: " +
      response.status +
      "\n\n" +
      "서버 응답:\n" +
      text
    );


  } catch (error) {

    serverStatus.className =
      "server-status error";

    serverStatus.textContent =
      "서버 연결 실패";


    showDebug(
      "❌ 서버 연결 오류\n\n" +

      "오류 이름:\n" +
      (error.name || "알 수 없음") +

      "\n\n오류 메시지:\n" +
      (error.message || "알 수 없음") +

      "\n\n요청 주소:\n" +
      API + "/" +

      "\n\n현재 페이지 주소:\n" +
      window.location.href +

      "\n\n현재 페이지 Origin:\n" +
      window.location.origin
    );

  }

}


/*
 * 파일 선택
 */
fileInput.addEventListener(
  "change",
  function () {

    addFiles(
      Array.from(fileInput.files)
    );

    fileInput.value = "";

  }
);


/*
 * 파일 선택창 열기
 */
dropZone.addEventListener(
  "click",
  function () {

    fileInput.click();

  }
);


/*
 * 드래그
 */
dropZone.addEventListener(
  "dragover",
  function (event) {

    event.preventDefault();

  }
);


/*
 * 드롭
 */
dropZone.addEventListener(
  "drop",
  function (event) {

    event.preventDefault();

    addFiles(
      Array.from(event.dataTransfer.files)
    );

  }
);


/*
 * 파일 추가
 */
function addFiles(files) {

  selectedFiles.push(...files);

  renderFiles();

}


/*
 * 파일 크기
 */
function formatSize(bytes) {

  if (bytes < 1024)
    return bytes + " B";

  if (bytes < 1024 * 1024)
    return (bytes / 1024).toFixed(1) + " KB";

  if (bytes < 1024 * 1024 * 1024)
    return (bytes / 1024 / 1024).toFixed(2) + " MB";

  return (bytes / 1024 / 1024 / 1024).toFixed(2) + " GB";

}


/*
 * 파일 목록
 */
function renderFiles() {

  fileList.innerHTML = "";

  selectedFiles.forEach(
    (file, index) => {

      const item =
        document.createElement("div");

      item.className =
        "file-item";

      item.innerHTML = `

        <div class="file-name"></div>

        <div class="file-size"></div>

        <div class="progress-container">
          <div
            class="progress"
            id="progress-${index}"
          ></div>
        </div>

        <div
          class="status"
          id="status-${index}"
        >
          업로드 대기 중
        </div>

      `;


      item.querySelector(
        ".file-name"
      ).textContent =
        file.name;


      item.querySelector(
        ".file-size"
      ).textContent =
        formatSize(file.size);


      fileList.appendChild(item);

    }
  );


  uploadButton.disabled =
    selectedFiles.length === 0;

}


/*
 * Base64 변환
 */
function fileToBase64(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () => resolve(reader.result);


      reader.onerror =
        () => reject(
          new Error(
            "파일을 읽을 수 없습니다."
          )
        );


      reader.readAsDataURL(file);

    }
  );

}


/*
 * 업로드
 */
async function uploadFile(file, index) {

  const progress =
    document.getElementById(
      "progress-" + index
    );

  const status =
    document.getElementById(
      "status-" + index
    );


  try {

    status.textContent =
      "파일 읽는 중...";


    const base64 =
      await fileToBase64(file);


    progress.style.width =
      "50%";


    status.textContent =
      "서버에 업로드하는 중...";


    const formData =
      new FormData();


    formData.append(
      "fileName",
      file.name
    );


    formData.append(
      "fileData",
      base64.split(",")[1]
    );


    const response =
      await fetch(
        API + "/upload",
        {
          method: "POST",
          body: formData
        }
      );


    const text =
      await response.text();


    let result;

    try {

      result =
        JSON.parse(text);

    } catch {

      throw new Error(
        "서버 응답이 JSON이 아닙니다.\n\n" +
        "HTTP 상태: " +
        response.status +
        "\n\n" +
        text
      );

    }


    if (!response.ok ||
        !result.success) {

      throw new Error(
        result.error ||
        "업로드 실패"
      );

    }


    progress.style.width =
      "100%";


    status.textContent =
      "업로드 성공";


    status.className =
      "status success";


  } catch (error) {

    progress.style.width =
      "0%";


    status.textContent =
      "업로드 실패";


    status.className =
      "status error";


    showDebug(
      "❌ 업로드 오류\n\n" +
      "오류 이름:\n" +
      (error.name || "알 수 없음") +
      "\n\n" +
      "오류 메시지:\n" +
      (error.message || "알 수 없음")
    );

  }

}


/*
 * 전체 업로드
 */
uploadButton.addEventListener(
  "click",
  async function () {

    uploadButton.disabled =
      true;

    for (
      let i = 0;
      i < selectedFiles.length;
      i++
    ) {

      await uploadFile(
        selectedFiles[i],
        i
      );

    }

    uploadButton.disabled =
      selectedFiles.length === 0;

  }
);


/*
 * 모두 지우기
 */
clearButton.addEventListener(
  "click",
  function () {

    selectedFiles = [];

    renderFiles();

  }
);


/*
 * 시작
 */
checkServer();

</script>

</body>
</html>
